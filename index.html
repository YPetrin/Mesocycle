<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0c0d">
<title>Atlas</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0c0d; --surface:#151517; --surface2:#1c1c1f; --line:#26262a; --line2:#3a3a40;
  --ink:#f0efec; --mid:#a2a2a6; --dim:#7e7e84;
  --acc:#b08d57; --acc-ink:#0c0c0d; --acc-soft:#6d5636;
  --red:#a3392f;
  --metal:linear-gradient(180deg,#3a3a40 0%,#2a2a2e 42%,#202024 100%);
  --metal-lit:linear-gradient(180deg,#46464d 0%,#323237 42%,#26262b 100%);
  --pad:20px;
  --ui:"Inter",ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:400 16px/1.5 var(--ui);font-variant-numeric:tabular-nums;letter-spacing:-0.005em;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
/* fine machined grain, kept under the content */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.5'/></svg>")}
#app,#foot{position:relative;z-index:1}
h1,h2{margin:0;font-weight:600;letter-spacing:-0.025em}
h1{font-size:29px;line-height:1.12}
h2{font-size:18px;line-height:1.25}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;font-variant-numeric:tabular-nums;font-weight:500;color:var(--ink);
  background:#101012;border:1px solid var(--line2);border-radius:6px;padding:13px;width:100%}
input::placeholder{color:var(--dim);font-weight:400}
input:focus,select:focus,button:focus-visible{outline:1px solid var(--acc);outline-offset:2px}

.wrap{max-width:540px;margin:0 auto;padding:4px var(--pad) 140px}
.hero{position:relative;min-height:calc(100svh - 104px);display:flex;align-items:flex-end;
  background-color:var(--bg);background-image:url("hero.jpg");
  background-size:cover;background-position:center top;background-repeat:no-repeat}
.heroshade{position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(12,12,13,.35) 0%, rgba(12,12,13,.05) 30%,
    rgba(12,12,13,.6) 60%, rgba(12,12,13,.95) 78%, var(--bg) 90%)}
.heroinner{position:relative;z-index:1;width:100%;max-width:540px;margin:0 auto;
  padding:0 var(--pad) calc(34px + env(safe-area-inset-bottom))}
.herobrand{font-size:13px;font-weight:700;letter-spacing:.2em;color:var(--acc);margin-bottom:14px}
.quote{font-size:23px;font-weight:600;line-height:1.32;letter-spacing:-0.025em;margin:0 0 26px;
  max-width:20ch;text-wrap:balance}
.herocta .btn{margin-top:0}
.herosub{font-size:13px;color:var(--mid);margin:10px 0 0;text-align:center}
.nav{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);box-shadow:0 1px 0 rgba(255,255,255,.03) inset}
.nav .brand{font-size:13px;font-weight:700;letter-spacing:.16em;color:var(--mid);padding:14px var(--pad) 0}
.nav .row2{display:flex;gap:20px;padding:8px var(--pad) 0;overflow-x:auto}
.nav .row2 button{padding:8px 0 11px;font-size:14px;font-weight:500;color:var(--dim);
  border-bottom:2px solid transparent;white-space:nowrap}
.nav .row2 button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--acc)}
.nav .row2 .cog{margin-left:auto;padding-left:14px;display:flex;align-items:center}
.top{padding:26px var(--pad) 8px;max-width:540px;margin:0 auto;display:flex;align-items:baseline;gap:12px}
.top .sub{color:var(--dim);font-size:12px;margin-left:auto;text-align:right;line-height:1.4}

/* panels with machined corner brackets */
.card{position:relative;border:1px solid var(--line);border-radius:4px;padding:19px;margin:14px 0;
  background:var(--surface);box-shadow:0 1px 0 rgba(255,255,255,.035) inset}
.card::before,.card::after{content:"";position:absolute;width:13px;height:13px;pointer-events:none}
.card::before{top:-1px;left:-1px;border-top:1px solid var(--line2);border-left:1px solid var(--line2);border-top-left-radius:4px}
.card::after{bottom:-1px;right:-1px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);border-bottom-right-radius:4px}
.card.flat{background:transparent;border-style:dashed;box-shadow:none}
.card.flat::before,.card.flat::after{display:none}
.row{display:flex;gap:12px;align-items:center}
.row.sb{justify-content:space-between}
.muted{color:var(--mid)} .dim{color:var(--dim);font-size:13px}
.big{font-size:50px;font-weight:700;letter-spacing:-0.045em;line-height:1}
.metaline{font-size:13px;color:var(--dim);margin-top:8px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stack{display:grid;gap:14px}
label.f{display:block;font-size:12px;font-weight:500;color:var(--dim);margin-bottom:7px;letter-spacing:0}

.btn{border:1px solid var(--line2);border-radius:6px;padding:15px;text-align:center;display:block;width:100%;
  margin-top:10px;font-weight:500;background:var(--metal);box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
.btn:active{background:var(--metal-lit)}
.btn.solid{background:var(--metal-lit);border-color:#4a4a52;color:var(--ink);font-weight:600}
.btn.small{padding:9px 13px;width:auto;font-size:14px;margin-top:0}
.pill{border:1px solid var(--line2);border-radius:3px;padding:5px 11px;font-size:12px;font-weight:500;color:var(--mid);background:var(--surface2)}
.pill.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}

.opts{display:grid;gap:8px;margin-top:12px}
.opt{border:1px solid var(--line);border-radius:4px;padding:14px;text-align:left;background:var(--surface2)}
.opt[aria-pressed="true"]{border-color:var(--line2);background:#232328}
.opt .k{font-weight:500} .opt .d{display:block;color:var(--dim);font-size:13px;margin-top:3px}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--dim);padding:7px 4px;border-bottom:1px solid var(--line);font-size:12px}
td{padding:12px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.n{font-weight:500}
tr:last-child td{border-bottom:0}

.setgrid,.setrow{display:grid;grid-template-columns:36px 1fr 1fr 1fr 54px;gap:8px;align-items:center}
.setrow{margin:10px 0}
.setrow input{padding:15px 6px;text-align:center;font-size:18px;font-weight:600}
.setrow .idx{border:1px solid transparent;border-radius:4px;height:44px;color:var(--dim);font-size:14px;font-weight:500}
.setrow .idx.warm,.setrow .idx.drop{border-color:var(--line2);color:var(--mid);font-size:11px}
.setrow .tick{border:1px solid var(--line2);border-radius:5px;height:51px;font-size:14px;font-weight:500;
  background:var(--metal);box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
.setrow.done input{border-color:#4a4a52;color:var(--ink);background:#2b2b31;font-weight:600}
.setrow.done .idx{color:var(--mid)}
.setrow.done .tick{background:#3a3a42;border-color:#5a5a64;color:var(--ink);font-weight:700}
.prev{grid-column:2 / 5;font-size:12px;color:var(--dim);text-align:center;margin:-2px 0 2px}
.pb{font-size:10px;letter-spacing:.08em;color:var(--ink);background:#2f2f35;border:1px solid #4a4a52;
  border-radius:3px;padding:2px 7px;margin-left:7px;font-weight:700}
.done-line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;text-align:left;
  border-bottom:1px solid var(--line);padding:15px 2px;background:transparent}
.done-line .nm{font-size:16px;font-weight:500;color:var(--mid)}
.done-line .vals{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.sslabel{font-size:12px;color:var(--mid);border-left:2px solid var(--line2);padding-left:10px;margin-bottom:10px}

.bar{height:3px;background:#0f0f11;border-radius:0;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--mid)}
.bar i.over{background:var(--red)}

.folder{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;
  border-bottom:1px solid var(--line);padding:21px 2px;background:transparent}
.folder .fname{font-size:19px;font-weight:600;letter-spacing:-0.02em;display:block}
.folder .meta{color:var(--dim);font-size:13px;margin-top:4px;display:block}
.folder .chev{color:var(--mid);font-size:22px;line-height:1}
.routine{border-bottom:1px solid var(--line);background:transparent}
.routine .go{display:block;width:100%;text-align:left;padding:19px 2px 6px}
.routine .meta{color:var(--dim);font-size:13px;margin-top:4px}
.routine .tools{display:flex;gap:8px;flex-wrap:wrap;padding:0 2px 17px}

.foot{position:fixed;left:0;right:0;bottom:0;z-index:8;
  background:linear-gradient(to top,var(--bg) 62%,rgba(12,12,13,.85) 86%,transparent);
  padding:16px var(--pad) calc(16px + env(safe-area-inset-bottom))}
.foot .inner{max-width:540px;margin:0 auto}
.restbar{font-size:22px;font-weight:700;letter-spacing:-0.03em;color:var(--acc);
  border:1px solid var(--acc-soft);border-radius:5px;padding:12px 14px;text-align:center;
  background:linear-gradient(180deg,#1d1a15 0%,#151311 100%);box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
.restbar.idle{color:var(--dim);font-size:13px;font-weight:400;border-color:var(--line);background:var(--surface)}
.resttop{font-size:20px;font-weight:700;letter-spacing:-0.03em;color:var(--acc);margin-left:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#2f2f35;border:1px solid #4a4a52;
  color:var(--ink);padding:11px 18px;border-radius:4px;font-size:14px;font-weight:600;z-index:20}
.scrim{position:fixed;inset:0;background:rgba(6,6,7,.86);display:flex;align-items:center;justify-content:center;padding:22px;z-index:30}
.sheet{background:var(--surface);border:1px solid var(--line2);border-radius:6px;padding:22px;max-width:420px;width:100%}
.sheet p{margin:0 0 14px;color:var(--mid)}

.clockbar{display:flex;align-items:baseline;gap:14px;width:100%}
.clock{font-size:15px;font-weight:500;color:var(--mid);font-variant-numeric:tabular-nums}
.histrow{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.hist{display:flex;justify-content:space-between;gap:12px;padding:16px 2px;flex:1;min-width:0;text-align:left}
.histdel{flex:none;align-self:center}
.hist strong{font-size:16px;font-weight:600}
.hist .d{color:var(--dim);font-size:13px}
.calwrap{padding:4px 0 20px;border-bottom:1px solid var(--line);margin-bottom:4px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.calhead button{border:1px solid var(--line2);border-radius:5px;width:38px;height:38px;background:var(--metal)}
.calhead strong{font-size:17px;font-weight:600;letter-spacing:-0.02em}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;width:100%}
.cal>*{min-width:0}
.cal .wd{text-align:center;font-size:10px;color:var(--dim);padding-bottom:6px}
.cal .day{aspect-ratio:1;border:1px solid transparent;border-radius:4px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;font-size:14px;color:var(--dim)}
.cal .day.has{color:var(--ink);border-color:var(--line2);background:var(--surface)}
.cal .day.today{border-color:var(--acc-soft)}
.cal .day:disabled{cursor:default}
.cal .day[aria-pressed="true"]{background:#2f2f35;color:var(--ink);border-color:#4a4a52;font-weight:600}
.cal .day i{width:4px;height:4px;border-radius:50%;background:var(--mid);display:block}
.cal .day.empty{opacity:.18}
.faces{display:flex;justify-content:space-between;gap:7px;margin-top:14px}
.facebtn{border:1px solid var(--line2);border-radius:5px;padding:10px 4px;flex:1;display:flex;justify-content:center;background:var(--surface2)}
.facebtn[aria-pressed="true"]{background:#2f2f35;border-color:#4a4a52}
.step{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.step button{border:1px solid var(--line2);border-radius:4px;width:36px;height:36px;font-size:18px;line-height:1;background:var(--metal)}
.step .v{min-width:22px;text-align:center;font-size:17px;font-weight:600}
.chart{width:100%;height:auto;aspect-ratio:320/150;margin-top:14px;display:block}
.statline{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.stat{font-size:34px;font-weight:700;letter-spacing:-0.04em;line-height:1}
.statsub{font-size:13px;color:var(--dim)}
.hr2{height:1px;background:var(--line);margin:18px 0}
.code{font-size:30px;font-weight:700;letter-spacing:.06em;color:var(--acc);margin:12px 0 0}
.search{margin-bottom:12px}
.empty{border:1px solid var(--line);border-radius:4px;padding:34px 20px;margin:14px 0;text-align:center;background:var(--surface)}
.empty p{color:var(--mid);margin:8px 0 18px}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:pop .16s ease-out}
  @keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="foot"></div>
<script>
/* ============================================================
   MESOCYCLE — RP-style hypertrophy training engine
   Single file. Data lives on this device. Optional Supabase sync.
   ============================================================ */

/* ---------- Volume landmarks (sets per muscle per week) ---------- */
const M = {
  chest:      {name:"Chest",       mv:8, mev:10, mav:18, mrv:22},
  back:       {name:"Back",        mv:6, mev:10, mav:20, mrv:25},
  quads:      {name:"Quads",       mv:6, mev:8,  mav:16, mrv:20},
  hams:       {name:"Hamstrings",  mv:3, mev:4,  mav:14, mrv:20},
  glutes:     {name:"Glutes",      mv:0, mev:4,  mav:12, mrv:16},
  calves:     {name:"Calves",      mv:6, mev:8,  mav:14, mrv:20},
  biceps:     {name:"Biceps",      mv:5, mev:8,  mav:18, mrv:26},
  triceps:    {name:"Triceps",     mv:4, mev:6,  mav:14, mrv:18},
  sideDelts:  {name:"Side delts",  mv:6, mev:8,  mav:20, mrv:26},
  rearDelts:  {name:"Rear delts",  mv:0, mev:6,  mav:16, mrv:24},
  frontDelts: {name:"Front delts", mv:0, mev:0,  mav:8,  mrv:12},
  traps:      {name:"Traps",       mv:0, mev:4,  mav:16, mrv:26},
  forearms:   {name:"Forearms",    mv:0, mev:2,  mav:10, mrv:16},
  abs:        {name:"Abs",         mv:0, mev:0,  mav:18, mrv:25}
};
const MK = Object.keys(M);

/* ---------- Equipment increments (kg) ---------- */
const INC = {barbell:2.5, cable:2.5, machine:5, dumbbell:2.5, bodyweight:2.5, smith:2.5};

/* ---------- Exercise library ---------- */
const e=(id,name,muscle,equip,lo,hi,fav)=>({id,name,muscle,equip,rep:[lo,hi],fav:!!fav});
const EX = [
  /* chest */
  e("bb-bench","Barbell bench press","chest","barbell",6,10,1),
  e("bb-incline","Incline barbell bench press","chest","barbell",6,10,1),
  e("db-bench","Dumbbell bench press","chest","dumbbell",8,12),
  e("db-incline","Incline dumbbell press","chest","dumbbell",8,12),
  e("mach-press","Machine chest press","chest","machine",8,12),
  e("mach-incline","Incline machine press","chest","machine",8,12),
  e("cable-fly-mid","Mid cable fly","chest","cable",10,15,1),
  e("cable-fly-low","Low to high cable fly","chest","cable",10,15),
  e("cable-fly-high","High to low cable fly","chest","cable",10,15),
  e("pec-deck","Pec deck","chest","machine",10,15),
  e("dip","Chest dip","chest","bodyweight",6,12),
  e("pushup","Push-up","chest","bodyweight",10,20,1),
  /* back */
  e("pulldown-neutral","Neutral-grip pulldown","back","cable",8,12,1),
  e("pulldown-wide","Wide-grip pulldown","back","cable",8,12),
  e("pullup","Pull-up","back","bodyweight",5,10),
  e("csr","Chest-supported row","back","machine",8,12,1),
  e("cable-row","Seated cable row","back","cable",8,12),
  e("db-row","Single-arm dumbbell row","back","dumbbell",8,12),
  e("bb-row","Barbell row","back","barbell",6,10),
  e("tbar","T-bar row","back","machine",8,12),
  e("straight-arm","Straight-arm rope pulldown","back","cable",12,15,1),
  e("lat-prayer","Cable lat pullover","back","cable",12,15),
  /* quads */
  e("leg-press","Leg press","quads","machine",8,15,1),
  e("hack","Hack squat","quads","machine",8,12),
  e("pendulum","Pendulum or belt squat","quads","machine",8,12),
  e("leg-ext","Leg extension","quads","machine",10,15,1),
  e("bb-squat","Barbell back squat","quads","barbell",5,10),
  e("smith-squat","Smith machine squat","quads","smith",8,12),
  e("bw-squat","Bodyweight squat","quads","bodyweight",15,25,1),
  e("split-squat","Bulgarian split squat","quads","dumbbell",8,12),
  e("walking-lunge","Walking lunge","quads","dumbbell",10,15),
  /* hamstrings */
  e("sldl","Stiff-leg deadlift","hams","barbell",6,10,1),
  e("rdl-db","Dumbbell Romanian deadlift","hams","dumbbell",8,12),
  e("leg-curl-seated","Seated leg curl","hams","machine",10,15,1),
  e("leg-curl-lying","Lying leg curl","hams","machine",10,15),
  e("good-morning","Good morning","hams","barbell",8,12),
  e("back-ext","45 degree back extension","hams","bodyweight",10,15),
  /* glutes */
  e("hip-thrust","Barbell hip thrust","glutes","barbell",8,12),
  e("glute-machine","Glute drive machine","glutes","machine",10,15),
  e("cable-kickback","Cable kickback","glutes","cable",12,20),
  e("abduction","Hip abduction machine","glutes","machine",12,20),
  /* calves */
  e("calf-press","Leg press calf raise","calves","machine",10,15,1),
  e("standing-calf","Standing calf raise","calves","machine",10,15),
  e("seated-calf","Seated calf raise","calves","machine",12,20),
  /* biceps */
  e("bb-curl","Barbell curl","biceps","barbell",8,12,1),
  e("db-curl","Standing dumbbell curl","biceps","dumbbell",8,12,1),
  e("bayesian","Bayesian cable curl","biceps","cable",10,15,1),
  e("spider","Spider curl","biceps","dumbbell",10,15,1),
  e("preacher","Preacher curl","biceps","machine",10,15),
  e("incline-curl","Incline dumbbell curl","biceps","dumbbell",10,15),
  e("hammer","Hammer curl","biceps","dumbbell",10,15),
  /* triceps */
  e("vbar-pushdown","V-bar pushdown","triceps","cable",10,15,1),
  e("rope-pushdown","Rope pushdown","triceps","cable",10,15,1),
  e("oh-rope","Overhead rope extension","triceps","cable",10,15,1),
  e("skull","Skullcrusher","triceps","barbell",8,12),
  e("db-oh","Overhead dumbbell extension","triceps","dumbbell",10,15),
  e("close-bench","Close-grip bench press","triceps","barbell",6,10),
  e("dip-tri","Triceps dip","triceps","bodyweight",8,12),
  /* side delts */
  e("cable-lat-raise","Cable lateral raise","sideDelts","cable",12,20,1),
  e("db-lat-raise","Dumbbell lateral raise","sideDelts","dumbbell",12,20,1),
  e("machine-lat-raise","Machine lateral raise","sideDelts","machine",12,20),
  e("upright-row","Cable upright row","sideDelts","cable",10,15),
  /* rear delts */
  e("face-pull","Face pull","rearDelts","cable",12,20,1),
  e("reverse-pec","Reverse pec deck","rearDelts","machine",12,20),
  e("rear-db-fly","Bent-over dumbbell reverse fly","rearDelts","dumbbell",12,20),
  e("cable-rear-fly","Cable reverse fly","rearDelts","cable",12,20),
  /* front delts */
  e("ohp","Standing overhead press","frontDelts","barbell",6,10,1),
  e("db-shoulder","Seated dumbbell shoulder press","frontDelts","dumbbell",8,12,1),
  e("machine-shoulder","Machine shoulder press","frontDelts","machine",8,12),
  e("front-raise","Cable front raise","frontDelts","cable",12,20),
  /* traps */
  e("db-shrug","Dumbbell shrug","traps","dumbbell",10,15),
  e("bb-shrug","Barbell shrug","traps","barbell",10,15),
  e("cable-shrug","Cable shrug","traps","cable",12,20),
  /* forearms */

      sess.entries[si]=m.log[k];

  const plan=(m.plan&&(m.plan[wk]||m.plan[1]))||[];

    name:m.name||"My routines",

const CODE_ALPHABET="23456789ABCDEFGHJKLMNPQRSTUVWXYZ";   /* no 0 O 1 I */
function makeCode(){

async function signInWithCode(code, creating){

      if(error && !/already/i.test(error.message||"")){

    }

  const live=(fid)=>p.days.map((d,di)=>({d,di})).filter(x=>!x.d.hidden && (x.d.folder||null)===fid);

  if(UI.folder){
    const f=p.folders.find(x=>x.id===UI.folder);
    if(!f){ UI.folder=null; }
    else{
      const inside=live(f.id);
      return `<div class="top"><h1>${h(f.name)}</h1><span class="sub">${inside.length} routines</span></div>
      <div class="wrap">
        ${inside.length?inside.map(x=>routineCard(x.d,x.di)).join("")
          :`<div class="empty"><h2>Empty folder</h2><p>Create a routine here, or move one in.</p></div>`}
        <button class="btn" data-newroutine="${f.id}">Create a routine here</button>
        <button class="btn" data-renamefolder="${f.id}">Rename folder</button>
        <button class="btn" data-delfolder="${f.id}" style="border-color:var(--red);color:var(--red)">Delete folder</button>
        <button class="btn" data-closefolder="1">Back to all routines</button>
      </div>`;
    }
  }

  const loose=live(null);
  const any=p.days.some(x=>!x.hidden) || p.folders.length;
  return `<div class="top"><h1>${h(p.name)}</h1><span class="sub">${p.days.filter(x=>!x.hidden).length} routines</span></div>
  <div class="wrap">
    ${p.folders.map(f=>{
      const n=live(f.id).length;
      return `<button class="folder" data-openfolder="${h(f.id)}">
        <span><span class="fname">${h(f.name)}</span><span class="meta">${n} ${n===1?"routine":"routines"}</span></span>
        <span class="chev">&rsaquo;</span></button>`;
    }).join("")}
    ${loose.map(x=>routineCard(x.d,x.di)).join("")}
    ${any?`<button class="btn" data-newroutine="">Create a routine</button>
           <button class="btn" data-newfolder="1">Create a folder</button>`
        :`<div class="empty"><h2>No routines yet</h2><p>Create one, then add the exercises you actually do. Folders are optional, for grouping something like a push, pull and legs cycle.</p>
          <button class="btn solid" data-newroutine="">Create a routine</button>
          <button class="btn" data-newfolder="1">Create a folder</button></div>`}
  </div>`;
}

/* A session left open overnight is almost always one you forgot to finish */
function staleSession(){
  const a=S.active;
  if(!a || UI.staleOk) return false;
  return (Date.now()-new Date(a.start))/3600000 > 6;
}
function viewStale(){
  const a=S.active, v=sessionVolume(a);
  return `<div class="nav"><div class="brand">Atlas</div></div>
  <div class="top"><h1>Unfinished session</h1></div>
  <div class="wrap">
    <div class="card">
      <div class="row sb"><span class="dim">Routine</span><strong>${h((P().days[a.di]||{name:"Deleted routine"}).name)}</strong></div>
      <div class="row sb" style="margin-top:8px"><span class="dim">Started</span><strong>${dstamp(a.start)} ${tstamp(a.start)}</strong></div>
      <div class="row sb" style="margin-top:8px"><span class="dim">Logged</span><strong>${v.sets} sets, ${v.volume.toLocaleString()} kg</strong></div>
      <p class="metaline">Open since ${ago(a.start)}. Anything you log now would be attached to it.</p>
    </div>
    <button class="btn solid" data-stalefinish="1">Finish and save it</button>
    <button class="btn" data-staleresume="1">Carry on with it</button>
    <button class="btn" data-stalediscard="1" style="border-color:var(--red);color:var(--red)">Discard it</button>
  </div>`;
}

/* ---------- Session ---------- */
function sessionOrder(a, day){
  const base=day.slots.map((_,i)=>i);
  if(!a.order) return base;
  const kept=a.order.filter(i=>i<day.slots.length);
  return kept.concat(base.filter(i=>!kept.includes(i)));
}
function viewSession(){
  const a=S.active, di=a.di, day=P().days[di];
  const order=sessionOrder(a, day);
  let body="";
  order.forEach((si, pos)=>{
    const slot=day.slots[si];
    const sets=plannedSets(di,si);
    if(slot.hidden || sets<=0) return;
    const ex=exById(slot.exId), eff=lastEffort(di,si), rng=slotRange(slot, ex);
    const log=a.entries[si]||[];
    const extras=log.filter(x=>x.warm||x.drop).length;
    const working=log.length-extras;
    if(working>=sets && !UI.openSlots[si]){
      const w2=log.filter(x=>!x.warm && !x.drop);
      const summary=w2.length?`${fmt(w2[w2.length-1].w)} kg &times; ${w2.map(x=>x.r).join(", ")}`:"warm-ups only";
      body+=`<button class="done-line" data-openslot="${si}"><span class="nm">${h(ex.name)}</span><span class="vals">${summary}</span></button>`;
      return;
    }
    const prev=eff?eff.sets:null;
    let rows="";
    for(let i=0;i<Math.max(sets+extras, log.length);i++){
      const s=log[i], done=!!s, p=prev&&prev[i];
      const carry=(!done && i>0 && log[i-1])?log[i-1]:null;
      const phW=carry?fmt(carry.w):"kg";
      const phR=carry?carry.r:"reps";
      const mark = s ? (s.warm?"warm":s.drop?"drop":"") : (UI.warmMark[si+"-"+i]||"");
      rows+=`${p?`<div class="setgrid"><span></span><div class="prev">last time ${fmt(p.w)} kg &times; ${p.r}${p.rir!=null?" @ "+p.rir+" RIR":""}</div><span></span></div>`:""}
      <div class="setrow ${done?"done":""}">
        <button class="idx ${mark?mark:""}" data-warm="${si}-${i}" aria-label="Set ${i+1} type">${mark==="warm"?"W":mark==="drop"?"D":i+1}</button>
        <input inputmode="decimal" data-in="w" data-si="${si}" data-i="${i}" value="${done?fmt(s.w):h(UI.draft[si+"-"+i+"-w"]||"")}" placeholder="${phW}" aria-label="Weight set ${i+1}">
        <input inputmode="numeric" data-in="r" data-si="${si}" data-i="${i}" value="${done?s.r:h(UI.draft[si+"-"+i+"-r"]||"")}" placeholder="${phR}" aria-label="Reps set ${i+1}">
        <input inputmode="numeric" data-in="rir" data-si="${si}" data-i="${i}" value="${done?(s.rir==null?"":s.rir):h(UI.draft[si+"-"+i+"-rir"]||"")}" placeholder="RIR" aria-label="Reps in reserve set ${i+1}">
        <button class="tick" data-logset="${si}" data-i="${i}">${done?"&check;":(i>=sets+extras&&!hasDraft(si,i))?"&times;":"Log"}</button>
      </div>${done && !s.warm && p && (s.w*s.r > p.w*p.r)?`<div class="metaline" style="margin:-2px 0 6px">Better than last time<span class="pb">PB</span></div>`:""}`;
    }
    body+=`<div class="card">
      ${slot.ss?`<div class="sslabel">Superset with ${h(exById(day.slots[si-1].exId).name)}</div>`:""}
      <div class="row sb"><button style="text-align:left" data-exhist="${h(slot.exId)}"><h2>${h(ex.name)}</h2></button>
        <span class="row" style="gap:6px">
          <button class="pill" data-sessmove="${si}-up" aria-label="Move earlier in this session">&uarr;</button>
          <button class="pill" data-sessmove="${si}-down" aria-label="Move later in this session">&darr;</button>
          <button class="pill" data-swap="${di}-${si}">Swap</button></span></div>
      <div class="row" style="align-items:baseline;gap:12px;margin-top:10px">
        <span class="big">${eff?fmt(eff.best.w):"&mdash;"}</span>
        <span class="muted">${eff?"kg &times; "+eff.best.r+" reps":"nothing logged yet"}</span></div>
      ${slot.note?`<div class="metaline" style="color:var(--mid)">${h(slot.note)}</div>`:""}
      <div class="metaline">${eff
        ? "Best set last time, "+ago(eff.when)+". Whole session: "+eff.sets.map(x=>fmt(x.w)+"&times;"+x.r).join(", ")+"."
        : "Rep range "+rng[0]+" to "+rng[1]+"."}
        Target ${sets} working ${sets===1?"set":"sets"}${extras?", plus "+extras+" marked warm-up or drop":""}.</div>
      <div class="setgrid" style="margin-top:14px"><span></span>
        <span class="dim" style="text-align:center">kg</span><span class="dim" style="text-align:center">reps</span>
        <span class="dim" style="text-align:center">RIR</span><span></span></div>
      ${rows}
      <button class="btn small" data-addset="${si}" style="margin-top:10px">Add a set</button>
    </div>`;
  });
  const v=sessionVolume(a);
  const moved = a.order && a.order.join(",")!==day.slots.map((_,i)=>i).join(",");
  return `<div class="nav"><div class="brand">Atlas</div></div>
    <div class="top"><div class="clockbar"><h1>${h(day.name)}</h1><span class="clock" id="clock">${clockText()}</span>
      <span class="resttop" id="resttop">${(()=>{const r=restState(); return r&&r.running?mmss(r.left):"";})()}</span></div>
      <span class="sub">${dstamp(a.start)}<br>${tstamp(a.start)}</span></div>
    <div class="wrap">${body}
    ${moved?`<div class="card flat dim">Order changed for today only. ${h(day.name)} itself is unchanged.</div>`:""}
    <button class="btn" data-addex="${di}">Add an exercise to this session</button>
    <div class="card flat dim">${v.sets} sets logged, ${v.volume.toLocaleString()} kg lifted</div></div>`;
}

/* ---------- History ---------- */
function sessionRow(s){
  const v=sessionVolume(s), day=P().days[s.di];
  return `<div class="histrow">
    <button class="hist" data-hist="${h(s.id)}">
      <span><strong>${h(day?day.name:"Deleted routine")}</strong>${s.rating!=null?`<span class="d"> ${h(RATING[s.rating])}</span>`:""}
      <div class="d">${v.sets} sets, ${v.volume.toLocaleString()} kg${s.start&&s.end?", "+dur(new Date(s.end)-new Date(s.start)):""}</div></span>
      <span class="d">${s.end?dstamp(s.end):""}</span></button>
    <button class="pill histdel" data-delsession="${h(s.id)}" aria-label="Delete this session">Delete</button>
  </div>`;
}
function viewCalendar(sessions){
  const now=new Date();
  const c=UI.cal||(UI.cal={y:now.getFullYear(), m:now.getMonth()});
  const lead=(new Date(c.y,c.m,1).getDay()+6)%7;
  const days=new Date(c.y,c.m+1,0).getDate();
  const byDay={};
  sessions.forEach(s=>{ const k=dkey(s.end||s.start); (byDay[k]=byDay[k]||[]).push(s); });
  const todayKey=dkey(new Date().toISOString());
  let cells="";
  for(let i=0;i<lead;i++) cells+=`<span class="day empty"></span>`;
  for(let n=1;n<=days;n++){
    const k=c.y+"-"+String(c.m+1).padStart(2,"0")+"-"+String(n).padStart(2,"0");
    const has=!!byDay[k];
    cells+=`<button class="day ${has?"has":""} ${k===todayKey?"today":""}" data-pickday="${k}" aria-pressed="${UI.calDay===k}" ${has?"":"disabled"}>${n}${has?"<i></i>":""}</button>`;
  }
  return `<div class="calwrap">
    <div class="calhead"><button data-cal="-1" aria-label="Previous month">&lsaquo;</button>
      <strong>${MONTHS[c.m]} ${c.y}</strong>
      <button data-cal="1" aria-label="Next month">&rsaquo;</button></div>
    <div class="cal">${["M","T","W","T","F","S","S"].map(x=>`<span class="wd">${x}</span>`).join("")}${cells}</div></div>`;
}
/* Gap between each logged set and the one before it, across the whole session */
function restMap(s){
  const all=[];
  Object.keys(s.entries||{}).forEach(si=>(s.entries[si]||[]).forEach((x,i)=>{ if(x.t) all.push({si, i, t:new Date(x.t).getTime()}); }));
  all.sort((a,b)=>a.t-b.t);
  const out={};
  all.forEach((x,n)=>{ if(n>0){ const g=Math.round((x.t-all[n-1].t)/1000); if(g>=20 && g<=1800) out[x.si+"-"+x.i]=g; } });
  return out;
}
const gap = s => Math.floor(s/60)+":"+String(s%60).padStart(2,"0");

function viewHistory(){
  const ss=P().sessions.filter(x=>x.finished);
  if(UI.histId){
    const s=ss.find(x=>x.id===UI.histId);
    if(s){
      const day=P().days[s.di]||{name:"Deleted routine", slots:[]}, v=sessionVolume(s);
      return `<div class="top"><h1>${h(day.name)}</h1><span class="sub">${s.end?dstamp(s.end):""}</span></div>
      <div class="wrap"><div class="card">
        <div class="row sb"><span class="dim">Duration</span><strong>${s.start&&s.end?dur(new Date(s.end)-new Date(s.start)):"not recorded"}</strong></div>
        <div class="row sb" style="margin-top:8px"><span class="dim">Volume</span><strong>${v.volume.toLocaleString()} kg</strong></div>
        ${s.rating!=null?`<div class="row sb" style="margin-top:8px"><span class="dim">Session</span><strong>${h(RATING[s.rating])}</strong></div>`:""}
        ${s.note&&!UI.editing?`<p class="metaline" style="color:var(--mid)">${h(s.note)}</p>`:""}
        ${UI.editing?`<div style="margin-top:12px"><label class="f">Notes</label><input data-snote="1" value="${h(s.note||"")}" placeholder="Anything worth remembering"></div>`:""}</div>
      ${day.slots.map((slot,si)=>{
        const a=(s.entries||{})[si]||[]; if(!a.length) return "";
        if(UI.editing) return `<div class="card"><h2>${h(exById(slot.exId).name)}</h2>
          <div class="setgrid"><span></span><span class="dim" style="text-align:center">kg</span>
          <span class="dim" style="text-align:center">reps</span><span class="dim" style="text-align:center">RIR</span><span></span></div>
          ${a.map((x,i)=>`<div class="setrow">
            <button class="idx ${x.warm||x.drop?"warm":""}" data-ewarm="${si}-${i}">${x.warm?"W":x.drop?"D":i+1}</button>
            <input inputmode="decimal" data-e="w" data-si="${si}" data-i="${i}" value="${fmt(x.w)}" aria-label="Weight set ${i+1}">
            <input inputmode="numeric" data-e="r" data-si="${si}" data-i="${i}" value="${x.r}" aria-label="Reps set ${i+1}">
            <input inputmode="numeric" data-e="rir" data-si="${si}" data-i="${i}" value="${x.rir==null?"":x.rir}" aria-label="Reps in reserve set ${i+1}">
            <button class="tick" data-edrop="${si}-${i}" aria-label="Delete set ${i+1}">&times;</button></div>`).join("")}</div>`;
        const rests=restMap(s);
        return `<div class="card"><button style="text-align:left" data-exhist="${h(slot.exId)}"><h2>${h(exById(slot.exId).name)}</h2></button>
          <table><tbody>${a.map((x,i)=>`<tr><td class="dim">${x.warm?"Warm-up":x.drop?"Drop set":"Set "+(i+1)}${rests[si+"-"+i]?`<div class="dim">rest ${gap(rests[si+"-"+i])}</div>`:""}</td>
            <td class="n">${fmt(x.w)} kg &times; ${x.r}${x.rir!=null&&x.rir!==""?" @ "+x.rir+" RIR":""}</td></tr>`).join("")}</tbody></table></div>`;
      }).join("")}
      ${UI.editing?`<div class="card"><h2>How was it</h2><div class="faces">${RATING.map((t,i)=>`<button class="facebtn" data-erate="${i}" aria-pressed="${s.rating===i}" aria-label="${t}">${face(i,s.rating===i)}</button>`).join("")}</div></div>
        <button class="btn solid" data-esave="1">Save changes</button>
        <button class="btn" data-ecancel="1">Done editing</button>
        <button class="btn" data-edelete="1" style="border-color:var(--red);color:var(--red)">Delete this session</button>`
      :`<button class="btn" data-eedit="1">Edit this session</button>`}
      <button class="btn" data-closehist="1">Back to history</button></div>`;
    }
  }
  const chosen=UI.calDay?ss.filter(s=>dkey(s.end||s.start)===UI.calDay):null;

    ? `<div class="row sb" style="margin:16px 0 4px"><h2>${h(dstamp(UI.calDay+"T12:00"))}</h2>

  return `<div class="top"><h1>History</h1><span class="sub">${ss.length} sessions</span></div>

}

/* ---------- Progress ---------- */
function weekStart(dt){ const d=new Date(dt); const off=(d.getDay()+6)%7; d.setHours(0,0,0,0); d.setDate(d.getDate()-off); return d; }
function weekKeys(n){
  const out=[], base=weekStart(new Date());
  for(let i=n-1;i>=0;i--){ const d=new Date(base); d.setDate(d.getDate()-i*7); out.push(d); }
  return out;
}
const wkey = d => d.toISOString().slice(0,10);

function lineChart(values, labels, opts){
  const o=opts||{}, W=320, H=150, n=values.length;
  const L=8, R=8, T=22, B=24;
  const max=Math.max(1, ...values)*1.12;
  const fmtv=o.fmt||(v=>String(Math.round(v)));
  const px=i=> n===1 ? W/2 : L + i*(W-L-R)/(n-1);
  const py=v=> H-B - (v/max)*(H-T-B);
  const pts=values.map((v,i)=>[px(i), py(v)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=`${line} L ${pts[pts.length-1][0].toFixed(1)} ${(H-B).toFixed(1)} L ${pts[0][0].toFixed(1)} ${(H-B).toFixed(1)} Z`;
  const grid=[0,.5,1].map(f=>`<line x1="${L}" y1="${py(max*f).toFixed(1)}" x2="${W-R}" y2="${py(max*f).toFixed(1)}" stroke="#26262a" stroke-width="1"/>`).join("");
  const dots=pts.slice(0,-1).map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2" fill="#3a3a40"/>`).join("");
  const last=pts[pts.length-1], lastV=values[values.length-1];
  const ends=[0, n-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>
    `<text x="${i===0?L:W-R}" y="${H-7}" font-size="10" fill="#7e7e84" text-anchor="${i===0?"start":"end"}">${h(labels[i]||"")}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${h(o.label||"chart")}">
    <defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b08d57" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#b08d57" stop-opacity="0"/></linearGradient></defs>
    ${grid}
    ${n>1?`<path d="${area}" fill="url(#fade)"/>`:""}
    ${n>1?`<path d="${line}" fill="none" stroke="#b08d57" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`:""}
    ${dots}
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.6" fill="#b08d57"/>
    <text x="${(W-R).toFixed(1)}" y="14" font-size="12" font-weight="600" fill="#f0efec" text-anchor="end">${h(fmtv(lastV))}</text>
    ${ends}</svg>`;
}

function sessionsPerWeek(n){
  const weeks=weekKeys(n), counts=weeks.map(()=>0);
  P().sessions.filter(s=>s.finished).forEach(s=>{
    const k=wkey(weekStart(s.end||s.start));
    const i=weeks.findIndex(w=>wkey(w)===k);
    if(i>=0) counts[i]++;
  });
  return {weeks, counts};
}
function volumePerWeek(mk, n){
  const weeks=weekKeys(n), vals=weeks.map(()=>0);
  P().sessions.filter(s=>s.finished).forEach(s=>{
    const day=P().days[s.di]; if(!day) return;
    const i=weeks.findIndex(w=>wkey(w)===wkey(weekStart(s.end||s.start)));
    if(i<0) return;
    Object.keys(s.entries||{}).forEach(si=>{
      const slot=day.slots[si]; if(!slot || slot.muscle!==mk) return;
      (s.entries[si]||[]).forEach(x=>{ if(!x.warm) vals[i]+=x.w*x.r; });
    });
  });
  return {weeks, vals};
}
function mainLifts(){
  const tally={};
  P().sessions.filter(s=>s.finished).forEach(s=>{
    const day=P().days[s.di]; if(!day) return;
    Object.keys(s.entries||{}).forEach(si=>{
      const slot=day.slots[si]; if(!slot) return;
      const sets=(s.entries[si]||[]).filter(x=>!x.warm);
      if(!sets.length) return;
      const best=sets.reduce((a,b)=>e1rm(b)>e1rm(a)?b:a);
      (tally[slot.exId]=tally[slot.exId]||[]).push({d:new Date(s.end||s.start), v:e1rm(best)});
    });
  });
  return Object.keys(tally).map(id=>{
    const pts=tally[id].sort((a,b)=>a.d-b.d);
    const first=pts[0], last=pts[pts.length-1];
    const monthAgo=Date.now()-30*86400000;
    const ref=pts.filter(p=>p.d<monthAgo).pop() || first;
    return {id, sessions:pts.length, now:last.v, change:last.v-ref.v, since:ref===first?"start":"a month ago", last:last.d};
  }).sort((a,b)=>b.sessions-a.sessions);
}

function viewProgress(){
  const done=P().sessions.filter(s=>s.finished);
  if(!done.length) return `<div class="top"><h1>Progress</h1></div>

  const sw=sessionsPerWeek(12);

  if(!muscles.includes(UI.volMuscle)) UI.volMuscle=muscles[0]||"chest";
  const vol=volumePerWeek(UI.volMuscle,8);
  const avg=Math.round(sw.counts.reduce((a,b)=>a+b,0)/12*10)/10;

  return `<div class="top"><h1>Progress</h1><span class="sub">${done.length} sessions</span></div>
  <div class="wrap">
    <div class="card"><h2>Sessions a week</h2>
      <div class="statline"><span class="stat">${sw.counts[sw.counts.length-1]}</span><span class="statsub">this week, ${avg} a week on average</span></div>
      ${lineChart(sw.counts, sw.weeks.map(w=>w.getDate()+" "+MONTHS[w.getMonth()]), {label:"Sessions per week"})}
      <p class="metaline">Last twelve weeks. The right hand bar is the week you are in, so it fills as you go.</p></div>

    <div class="card"><h2>Volume by muscle</h2>
      <div class="statline"><span class="stat">${vol.vals[vol.vals.length-1]>=1000?fmt(vol.vals[vol.vals.length-1]/1000)+"t":Math.round(vol.vals[vol.vals.length-1])+"kg"}</span>
        <span class="statsub">${h(M[UI.volMuscle].name)} this week</span></div>
      <div class="row" style="flex-wrap:wrap;margin-top:12px">
        ${muscles.map(mk=>`<button class="pill ${UI.volMuscle===mk?"on":""}" data-volmuscle="${mk}">${h(M[mk].name)}</button>`).join("")}
      </div>
      ${lineChart(vol.vals, vol.weeks.map(w=>w.getDate()+" "+MONTHS[w.getMonth()]), {label:"Volume per week", fmt:v=>v>=1000?fmt(v/1000)+" t":Math.round(v)+" kg"})}
      <p class="metaline">Weight times reps, working sets only. It moves when you swap exercises or change rep ranges, so read the shape rather than the number.</p></div>

    <div class="card"><h2>Estimated one rep max</h2>
      <table style="margin-top:10px"><thead><tr><th>Lift</th><th class="n">Now</th><th class="n">Change</th></tr></thead><tbody>
      ${lifts.map(l=>`<tr><td><button style="text-align:left" data-exhist="${h(l.id)}">${h(exById(l.id).name)}</button>
        <div class="dim">${l.sessions} ${l.sessions===1?"session":"sessions"}</div></td>
        <td class="n">${fmt(l.now)} kg</td>
        <td class="n" style="color:${l.change>0.4?"var(--ink)":l.change<-0.4?"var(--red)":"var(--dim)"}">
          ${l.sessions<2?"&mdash;":(l.change>0?"+":"")+fmt(l.change)+" kg"}</td></tr>`).join("")}
      </tbody></table>
      <p class="metaline">Against ${lifts.length&&lifts[0].since==="start"?"your first session on each lift":"a month ago, or your first session if that is more recent"}. Estimated from your best set, so it drifts above about ten reps.</p></div>
  </div>`;
}

}

/* ============================================================
   EVENTS
   ============================================================ */
function doAct(act, arg){
  const p=P();
  if(act==="discard"){ S.active=null; UI.draft={}; UI.warmMark={}; UI.openSlots={}; UI.staleOk=false; save(); toast("Session discarded."); return; }
  if(act==="removeex"){ const [di,si]=arg.split("-").map(Number); p.days[di].slots[si].hidden=true; save(); return; }
  if(act==="delex"){
    S.custom=S.custom.filter(x=>x.id!==arg); syncCustom();
    UI.newEx=null; save(); toast("Exercise deleted."); return;
  }
  if(act==="delfolder"){
    p.days.forEach(day=>{ if(day.folder===arg) day.folder=null; });
    p.folders=p.folders.filter(f=>f.id!==arg);
    UI.folder=null; save(); toast("Folder deleted."); return;
  }
  if(act==="delroutine"){
    const di=+arg;
    p.days[di].hidden=true; UI.editRoutine=null; save(); toast("Routine deleted."); return;
  }
  if(act==="delsession"){ p.sessions=p.sessions.filter(x=>x.id!==arg); UI.histId=null; UI.editing=false; save(); toast("Session deleted."); return; }
  if(act==="newprogram"){ S.program={name:"My routines", days:[], sessions:P().sessions}; S.active=null; save(); return; }
  if(act==="reset"){
    ["atlas.state.v3","mesocycle.state.v2","mesocycle.state.v1"].forEach(k=>localStorage.removeItem(k));
    S=fresh(); syncCustom();
    UI={tab:"home",wizard:null,toast:null,pickFor:null,draft:{},histId:null,cal:null,calDay:null,search:"",newEx:null,
        exHist:null,editing:false,warmMark:{},focus:null,ask:null,newRoutine:null,openSlots:{},editRoutine:null,orm:null};
    return;
  }
}

document.addEventListener("click", async ev=>{
  const b=ev.target.closest("button"); if(!b) return;
  const d=b.dataset;

  if(d.askyes){ const a=UI.ask; UI.ask=null; if(a) doAct(a.act,a.arg); render(); return; }
  if(d.askno){ UI.ask=null; render(); return; }

  if(d.tab){ if(d.tab==="settings" && S.cfg.url && S.cfg.key){ ensureSession().then(refreshWho); }
    UI.tab=d.tab; UI.folder=null; UI.moveFor=null; UI.newFolder=null; UI.pickFor=null; UI.histId=null; UI.exHist=null; UI.editing=false; UI.editRoutine=null; UI.tuneSlot=null; UI.focus=null; window.scrollTo(0,0); render(); return; }
  if(d.sessmove){
    const [siRaw,dir]=d.sessmove.split("-");
    const a=S.active, day=P().days[a.di];
    const order=sessionOrder(a, day).slice();
    const pos=order.indexOf(+siRaw), to = dir==="up" ? pos-1 : pos+1;
    if(to<0 || to>=order.length){ toast(dir==="up"?"Already first.":"Already last."); return; }
    const t=order[pos]; order[pos]=order[to]; order[to]=t;
    a.order=order; save(); render(); return;
  }
  if(d.openslot!=null && d.openslot!==""){ UI.openSlots[d.openslot]=!UI.openSlots[d.openslot]; render(); return; }
  if(d.exhist){ UI.exHist=d.exhist; UI.focus=null; window.scrollTo(0,0); render(); return; }
  if(d.closeex){ UI.exHist=null; window.scrollTo(0,0); render(); return; }


  /* routines */
  if(d.openfolder){ UI.folder=d.openfolder; window.scrollTo(0,0); render(); return; }
  if(d.closefolder){ UI.folder=null; window.scrollTo(0,0); render(); return; }
  if(d.newfolder){ UI.newFolder={id:null,name:""}; UI.focus="fdname"; render(); return; }
  if(d.renamefolder){
    const f=P().folders.find(x=>x.id===d.renamefolder);
    UI.newFolder={id:f.id, name:f.name}; UI.focus="fdname"; render(); return;
  }
  if(d.cancelfolder){ UI.newFolder=null; UI.focus=null; render(); return; }
  if(d.savefolder){
    const name=$("#fdname").value.trim();
    if(!name){ toast("Give it a name."); return; }
    if(UI.newFolder.id){ P().folders.find(x=>x.id===UI.newFolder.id).name=name; }
    else{
      const id="f"+Date.now();
      P().folders.push({id, name});
      if(UI.moveFor!=null){ P().days[UI.moveFor].folder=id; UI.moveFor=null; UI.folder=id; }
    }
    UI.newFolder=null; UI.focus=null; save(); render(); return;
  }
  if(d.delfolder){ ask("Delete this folder? The routines inside move back to the main screen.", "delfolder", d.delfolder, true); return; }
  if(d.movefor!=null && d.movefor!==""){ UI.moveFor=+d.movefor; window.scrollTo(0,0); render(); return; }
  if(d.cancelmove){ UI.moveFor=null; render(); return; }
  if(d.moveto!=null){
    P().days[UI.moveFor].folder = d.moveto || null;
    UI.moveFor=null; save(); render(); toast("Moved."); return;
  }
  if(d.newroutine!=null){
    UI.newRoutine={di:null, name:"", folder:d.newroutine||UI.folder||null};
    UI.focus="rtname"; render(); return;
  }
  if(d.renameroutine){ UI.newRoutine={di:+d.renameroutine, name:P().days[+d.renameroutine].name}; UI.focus="rtname"; render(); return; }
  if(d.cancelroutine){ UI.newRoutine=null; UI.focus=null; render(); return; }
  if(d.saveroutine){
    const name=$("#rtname").value.trim();
    if(!name){ toast("Give it a name."); return; }
    if(UI.newRoutine.di!=null) P().days[UI.newRoutine.di].name=name;
    else {
      P().days.push({name, slots:[], hidden:false, folder:UI.newRoutine.folder||null});
      UI.editRoutine=P().days.length-1;
    }
    UI.newRoutine=null; UI.focus=null; save(); render(); return;
  }
  if(d.moveex){
    const [di,si,dir]=d.moveex.split("-");
    const day=P().days[+di], i=+si, j = dir==="up" ? i-1 : i+1;
    if(j<0 || j>=day.slots.length){ toast(dir==="up"?"Already first.":"Already last."); return; }
    const t=day.slots[i]; day.slots[i]=day.slots[j]; day.slots[j]=t;
    /* logged sets are keyed by position, so swap them in every session too */
    P().sessions.forEach(s=>{
      if(s.di!==+di || !s.entries) return;
      const a=s.entries[i], b2=s.entries[j];
      if(a===undefined && b2===undefined) return;
      if(b2===undefined) delete s.entries[i]; else s.entries[i]=b2;
      if(a===undefined) delete s.entries[j]; else s.entries[j]=a;
    });
    if(S.active && S.active.di===+di && S.active.entries){
      const a=S.active.entries[i], b2=S.active.entries[j];
      if(b2===undefined) delete S.active.entries[i]; else S.active.entries[i]=b2;
      if(a===undefined) delete S.active.entries[j]; else S.active.entries[j]=a;
    }
    save(); render(); return;
  }
  if(d.tune){ UI.tuneSlot=d.tune; window.scrollTo(0,0); render(); return; }
  if(d.canceltune){ UI.tuneSlot=null; render(); return; }
  if(d.savetune){
    const [di,si]=UI.tuneSlot.split("-").map(Number), slot=P().days[di].slots[si];
    const lo=parseInt($("#tlo").value,10), hi=parseInt($("#thi").value,10), inc=parseFloat($("#tinc").value);
    slot.note=$("#tnote").value.trim();
    if(!isNaN(lo)&&!isNaN(hi)&&lo>0&&hi>=lo) slot.rep=[lo,hi];
    if(!isNaN(inc)&&inc>0) slot.inc=inc;
    UI.tuneSlot=null; save(); render(); toast("Saved."); return;
  }
  if(d.duproutine){
    const di=+d.duproutine, src=P().days[di];
    P().days.push({name:src.name+" copy", hidden:false,
      slots:src.slots.filter(s=>!s.hidden).map(s=>Object.assign({}, s))});
    UI.editRoutine=P().days.length-1;
    save(); window.scrollTo(0,0); render(); toast("Routine duplicated."); return;
  }
  if(d.editroutine){ UI.editRoutine=+d.editroutine; window.scrollTo(0,0); render(); return; }
  if(d.closeeditor){ UI.editRoutine=null; window.scrollTo(0,0); render(); return; }
  if(d.delroutine){ ask("Delete "+P().days[+d.delroutine].name+"? Past sessions are kept.", "delroutine", d.delroutine, true); return; }
  if(d.sets){
    const [di,si]=d.sets.split("-").map(Number), sl=P().days[di].slots[si];
    sl.sets=Math.max(0, Math.min(10, sl.sets+(+d.delta)));
    save(); render(); return;
  }
  if(d.remove){
    const [di,si]=d.remove.split("-").map(Number);
    ask("Remove "+exById(P().days[di].slots[si].exId).name+" from "+P().days[di].name+"? Past sessions are kept.", "removeex", d.remove, true);
    return;
  }
  if(d.ss){ const [di,si]=d.ss.split("-").map(Number); const sl=P().days[di].slots[si]; sl.ss=!sl.ss; save(); render(); return; }
  if(d.addex){ UI.pickFor="add-"+d.addex; window.scrollTo(0,0); render(); return; }
  if(d.swap){ UI.pickFor=d.swap; window.scrollTo(0,0); render(); return; }
  if(d.pick){
    if(UI.pickFor.startsWith("add-")){
      const di=+UI.pickFor.slice(4), ex=exById(d.pick);
      P().days[di].slots.push({muscle:ex.muscle, exId:ex.id, sets:3, ss:false, hidden:false});
    } else {
      const [di,si]=UI.pickFor.split("-").map(Number);
      P().days[di].slots[si].exId=d.pick;
    }
    UI.pickFor=null; UI.search=""; UI.focus=null; save(); render(); return;
  }
  if(d.cancelpick){ UI.pickFor=null; UI.search=""; UI.focus=null; render(); return; }
  if(d.newex){ UI.newEx={muscle:"chest", equip:"machine", lo:8, hi:12, name:""}; render(); return; }
  if(d.cancelnewex){ UI.newEx=null; render(); return; }
  if(d.savenewex){
    const name=$("#nxname").value.trim();
    if(!name){ toast("Give it a name."); return; }
    const lo=parseInt($("#nxlo").value,10)||8, hi=parseInt($("#nxhi").value,10)||12;
    const body={name, muscle:$("#nxmuscle").value, equip:$("#nxequip").value, rep:[Math.min(lo,hi),Math.max(lo,hi)], fav:true};
    if(UI.newEx.id){ Object.assign(S.custom.find(x=>x.id===UI.newEx.id), body); }
    else S.custom.push(Object.assign({id:"c"+Date.now()}, body));
    syncCustom(); UI.newEx=null; UI.search=name; save(); render(); toast("Exercise saved."); return;
  }
  if(d.editex){
    const x=S.custom.find(y=>y.id===d.editex);
    if(x) UI.newEx={id:x.id, name:x.name, muscle:x.muscle, equip:x.equip, lo:x.rep[0], hi:x.rep[1]};
    render(); return;
  }
  if(d.delex){
    const inUse=P().days.some(day=>day.slots.some(s=>!s.hidden && s.exId===d.delex));
    ask(inUse
      ? "That exercise is used in a routine. Delete it anyway? The routine keeps the slot, labelled as removed."
      : "Delete this exercise? Past sessions keep their records.", "delex", d.delex, true);
    return;
  }

  /* session */
  if(d.start!=null && d.start!==""){
    const di=+d.start;
    S.active={id:"s"+Date.now(), di, start:new Date().toISOString(), entries:{}, rating:null, finished:false, finishing:false};
    UI.draft={}; UI.warmMark={}; UI.openSlots={}; UI.staleOk=false; save(); window.scrollTo(0,0); render(); return;
  }
  if(d.logset!=null && d.logset!==""){
    const si=+d.logset, i=+d.i, a=S.active;
    const row=b.closest(".setrow"), g=n=>row.querySelector('[data-in="'+n+'"]');
    const lg=a.entries[si]||(a.entries[si]=[]);
    if(lg[i]){
      /* unlock for editing, keeping what you typed */
      const s=lg[i];
      UI.draft[si+"-"+i+"-w"]=fmt(s.w);
      UI.draft[si+"-"+i+"-r"]=String(s.r);
      UI.draft[si+"-"+i+"-rir"]=s.rir==null?"":String(s.rir);
      if(s.warm) UI.warmMark[si+"-"+i]="warm"; else if(s.drop) UI.warmMark[si+"-"+i]="drop";
      lg.splice(i,1);
      save(); render(); return;
    }
    if(b.textContent.trim()==="\u00d7"){
      const slot=P().days[a.di].slots[si];
      if(slot.sets>0) slot.sets--;
      ["w","r","rir"].forEach(f=>delete UI.draft[si+"-"+i+"-"+f]);
      save(); render(); return;
    }
    const w=parseFloat(g("w").value||g("w").placeholder);
    const r=parseInt(g("r").value||g("r").placeholder,10);
    const rirRaw=g("rir").value;
    if(isNaN(w)||isNaN(r)){ toast("Enter a weight and reps."); return; }
    lg[i]={w, r, rir:rirRaw===""?null:parseInt(rirRaw,10), t:new Date().toISOString()};
    const mk=UI.warmMark[si+"-"+i];
    if(mk==="warm") lg[i].warm=true; else if(mk==="drop") lg[i].drop=true;
    delete UI.warmMark[si+"-"+i];
    ["w","r","rir"].forEach(f=>delete UI.draft[si+"-"+i+"-"+f]);
    save(); render(); return;
  }
  if(d.addset!=null && d.addset!==""){ P().days[S.active.di].slots[+d.addset].sets++; save(); render(); return; }
  if(d.warm){
    const [si,i]=d.warm.split("-").map(Number), lg=S.active.entries[si]||[];
    const next=cur=>cur===""?"warm":cur==="warm"?"drop":"";
    if(lg[i]){
      const cur=lg[i].warm?"warm":lg[i].drop?"drop":"", n=next(cur);
      delete lg[i].warm; delete lg[i].drop;
      if(n==="warm") lg[i].warm=true; else if(n==="drop") lg[i].drop=true;
    } else {
      const k=si+"-"+i;
      UI.warmMark[k]=next(UI.warmMark[k]||"");
      if(!UI.warmMark[k]) delete UI.warmMark[k];
    }
    save(); render(); return;
  }
  if(d.staleresume){ UI.staleOk=true; render(); return; }
  if(d.stalefinish){ UI.staleOk=true; S.active.finishing=true; save(); render(); return; }
  if(d.stalediscard){ ask("Discard that unfinished session? Nothing is saved.", "discard", null, true); return; }
  if(d.finishsession){ S.active.finishing=true; window.scrollTo(0,0); save(); render(); return; }
  if(d.backtosession){ S.active.finishing=false; window.scrollTo(0,0); render(); return; }
  if(d.discard){ ask("Discard this session? Nothing is saved.", "discard", null, true); return; }
  if(d.rate!=null && d.rate!==""){ if(S.active){ S.active.rating=+d.rate; save(); render(); } return; }
  if(d.savesession){
    const a=S.active;
    if(!Object.values(a.entries).some(x=>x.length)){ toast("Nothing logged. Discard instead."); return; }
    const nf=$("#snote"); if(nf) a.note=nf.value.trim();
    a.end=new Date().toISOString(); a.finished=true; delete a.finishing;
    P().sessions.push(a); S.active=null; UI.draft={}; UI.warmMark={}; UI.openSlots={}; UI.staleOk=false; UI.tab="home";
    save(); window.scrollTo(0,0); render(); toast("Session saved."); return;
  }

  /* history */
  if(d.delsession){ ask("Delete this session? It cannot be recovered.", "delsession", d.delsession, true); return; }
  if(d.hist){ UI.histId=d.hist; window.scrollTo(0,0); render(); return; }
  if(d.closehist){ UI.histId=null; UI.editing=false; render(); return; }
  if(d.cal){ const c=UI.cal, n=c.m+(+d.cal); UI.cal={y:c.y+Math.floor(n/12), m:((n%12)+12)%12}; render(); return; }
  if(d.pickday){ UI.calDay=(UI.calDay===d.pickday)?null:d.pickday; render(); return; }
  if(d.clearday){ UI.calDay=null; render(); return; }
  if(d.eedit){ UI.editing=true; window.scrollTo(0,0); render(); return; }
  if(d.ecancel){ UI.editing=false; render(); return; }
  if(d.erate){ const s=P().sessions.find(x=>x.id===UI.histId); if(s){ s.rating=+d.erate; save(); render(); } return; }
  if(d.ewarm){
    const [si,i]=d.ewarm.split("-").map(Number), s=P().sessions.find(x=>x.id===UI.histId);
    if(s&&s.entries[si]&&s.entries[si][i]){
      const x=s.entries[si][i], cur=x.warm?"warm":x.drop?"drop":"";
      delete x.warm; delete x.drop;
      if(cur==="") x.warm=true; else if(cur==="warm") x.drop=true;
      save(); render();
    }
    return;
  }
  if(d.edrop){
    const [si,i]=d.edrop.split("-").map(Number), s=P().sessions.find(x=>x.id===UI.histId);
    if(s&&s.entries[si]){ s.entries[si].splice(i,1); save(); render(); }
    return;
  }
  if(d.esave){
    const s=P().sessions.find(x=>x.id===UI.histId); if(!s) return;
    const nf=document.querySelector("[data-snote]"); if(nf) s.note=nf.value.trim();
    document.querySelectorAll("[data-e]").forEach(el=>{
      const si=el.dataset.si, i=+el.dataset.i, f=el.dataset.e;
      if(!s.entries[si]||!s.entries[si][i]) return;
      if(f==="rir"){ s.entries[si][i].rir = el.value===""?null:parseInt(el.value,10); return; }
      const v=f==="w"?parseFloat(el.value):parseInt(el.value,10);
      if(!isNaN(v)) s.entries[si][i][f]=v;
    });
    UI.editing=false; save(); render(); toast("Session updated."); return;
  }
  if(d.edelete){ ask("Delete this session? It cannot be recovered.", "delsession", UI.histId, true); return; }

  /* info */
  if(d.volmuscle){ UI.volMuscle=d.volmuscle; render(); return; }
  if(d.orm){
    const w=parseFloat($("#ormw").value), r=parseInt($("#ormr").value,10);
    if(isNaN(w)||isNaN(r)||r<1){ toast("Enter a weight and reps."); return; }
    UI.orm={w, r:Math.min(20,r)}; render(); return;
  }

  /* settings */
  if(d.saverest){
    const n=parseInt($("#restlen").value,10);
    if(isNaN(n)||n<5||n>900){ toast("Enter between 5 and 900 seconds."); return; }
    S.cfg.rest=n; save(); render(); toast("Rest set to "+n+" seconds."); return;
  }
  if(d.savecfg){ S.cfg.url=$("#sburl").value.trim().replace(/\/$/,""); S.cfg.key=$("#sbkey").value.trim(); sb=null; save(false); toast("Saved."); render(); return; }
  if(d.newcode){
    const code=makeCode();
    const okDone=await signInWithCode(code, true);
    if(okDone){ UI.newCode=prettyCode(code); render(); }
    return;
  }
  if(d.usecode){
    const el=$("#codein"); if(!el) return;
    UI.newCode=null;
    await signInWithCode(el.value, false);
    return;
  }
  if(d.signout){ UI.newCode=null; signOutCode(); return; }
  if(d.testconn){
    S.cfg.url=$("#sburl").value.trim().replace(/\/$/,""); S.cfg.key=$("#sbkey").value.trim(); sb=null; save(false);
    testConnection(); return;
  }
  if(d.pull){ pullRemote(false); return; }
  if(d.push){ await pushRemote(); toast("Pushed."); return; }
  if(d.export){
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));
    a.download="atlas-backup-"+new Date().toISOString().slice(0,10)+".json"; a.click(); URL.revokeObjectURL(a.href); return;
  }
  if(d.import){ $("#importfile").click(); return; }
  if(d.csv){
    const rows=[["date","time","routine","exercise","set","type","kg","reps","rir","session_rating"]];
    P().sessions.filter(x=>x.finished).forEach(s=>{
      const day=P().days[s.di]; if(!day) return;
      Object.keys(s.entries||{}).forEach(si=>{
        const slot=day.slots[si]; if(!slot) return;
        (s.entries[si]||[]).forEach((x,i)=>rows.push([dkey(s.end||s.start), tstamp(s.start||s.end), day.name,
          exById(slot.exId).name, i+1, x.warm?"warm-up":x.drop?"drop":"working", x.w, x.r, x.rir==null?"":x.rir,
          s.rating!=null?RATING[s.rating]:""]));
      });
    });
    const csv=rows.map(r=>r.map(c=>/[",]/.test(String(c))?'"'+String(c).replace(/"/g,'""')+'"':c).join(",")).join("\n");
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    a.download="atlas-sessions-"+new Date().toISOString().slice(0,10)+".csv"; a.click(); URL.revokeObjectURL(a.href); return;
  }
  if(d.update){
    UI.diag="Clearing the cache..."; render();
    try{
      if("caches" in window){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }
      if(navigator.serviceWorker){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r=>r.unregister()));
      }
    }catch(err){ /* best effort */ }
    location.replace(location.pathname+"?v="+Date.now());
    return;
  }
  if(d.newprogram){ ask("Clear every routine? Past sessions are kept.", "newprogram", null, true); return; }
  if(d.reset){ ask("Erase everything on this device? Cloud data is untouched until the next push.", "reset", null, true); return; }
});

document.addEventListener("change", ev=>{
  if(ev.target.id==="importfile"){
    const f=ev.target.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const o=JSON.parse(fr.result);
        S = o.v===3 ? o : migrate(o);
        syncCustom(); save(); render(); toast("Imported.");
      }catch(err){ toast("That file did not parse."); }
    };
    fr.readAsText(f);
  }
});
document.addEventListener("input", ev=>{
  const t=ev.target;
  if(t.id==="exsearch"){ UI.search=t.value; UI.focus="exsearch"; render(); return; }
  if(t.dataset && t.dataset.in) UI.draft[t.dataset.si+"-"+t.dataset.i+"-"+t.dataset.in]=t.value;
});

/* Ask the server what the current build is, and update if this copy is behind */
async function checkForUpdate(){
  try{
    const r=await fetch("index.html?ts="+Date.now(), {cache:"no-store"});
    if(!r.ok) return;
    const txt=await r.text();
    const m=/const BUILD="(\d+)"/.exec(txt);
    if(!m) return;
    const server=m[1];
    if(server===BUILD) return;
    if(sessionStorage.getItem("atlas.updating")===server) return;   // never loop
    sessionStorage.setItem("atlas.updating", server);
    if("caches" in window){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }
    if(navigator.serviceWorker){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(x=>x.unregister()));
    }
    location.replace(location.pathname+"?v="+server);
  }catch(err){ /* offline, carry on with what we have */ }
}

/* ============================================================
   BOOT
   ============================================================ */
render();
if(S.cfg.url && S.cfg.key){ ensureSession().then(()=>pullRemote(true)).then(refreshWho); }
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
checkForUpdate();
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && !S.active) checkForUpdate(); });
</script>
