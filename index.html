<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Mesocycle</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#000; --panel:#0f0f10; --line:#2a2a2d; --line2:#3a3a3f;
  --ink:#fff; --mid:#a3a3a8; --dim:#67676d; --warn:#e5484d; --ok:#d6d6d8;
  --pad:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{
  font:400 16px/1.45 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums; padding-bottom:96px;
  padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-0.01em}
h1{font-size:22px}
h2{font-size:17px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:var(--pad)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding:14px var(--pad) 12px;display:flex;align-items:baseline;gap:10px}
.top .sub{color:var(--dim);font-size:13px;margin-left:auto}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0;background:var(--panel)}
.card.flat{background:transparent}
.row{display:flex;gap:10px;align-items:center}
.row.sb{justify-content:space-between}
.muted{color:var(--mid)}
.dim{color:var(--dim);font-size:13px}
.big{font-size:40px;font-weight:600;letter-spacing:-0.03em;line-height:1}
.metaline{font-size:13px;color:var(--dim);margin-top:4px}
.btn{border:1px solid var(--line2);border-radius:10px;padding:12px 14px;text-align:center;display:block;width:100%}
.btn.solid{background:#fff;color:#000;border-color:#fff;font-weight:600}
.btn.small{padding:8px 12px;width:auto;font-size:14px}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;display:flex;gap:10px;align-items:flex-start}
.opt[aria-pressed="true"]{border-color:#fff;background:#17171a}
.opt .k{font-weight:600}
.opt .d{display:block;color:var(--dim);font-size:13px;margin-top:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:10px 4px;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:#fff;color:#000;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--dim);padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:8px 4px;border-bottom:1px solid #1c1c1f;vertical-align:middle}
td.n,th.n{text-align:right}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 1fr 44px;gap:6px;align-items:center;margin:8px 0}
.setrow .idx{color:var(--dim);font-size:13px}
.setrow input{padding:12px 8px;text-align:center}
.setrow .tick{border:1px solid var(--line2);border-radius:8px;height:44px}
.setrow.done input{border-color:var(--line);color:var(--mid);background:#0a0a0b}
.setrow.done .tick{background:#fff;color:#000;border-color:#fff;font-weight:700}
.bar{height:6px;background:#1c1c1f;border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:#fff}
.bar i.over{background:var(--warn)}
.foot{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,#000 70%,transparent);
  padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom));z-index:6}
.foot .inner{max-width:560px;margin:0 auto}
.tabs{display:flex;gap:6px;border-top:1px solid var(--line);background:#000}
.tabs button{flex:1;padding:12px 4px;font-size:13px;color:var(--dim)}
.tabs button[aria-pressed="true"]{color:#fff;box-shadow:inset 0 2px 0 #fff}
.warn{color:var(--warn)}
.pill{border:1px solid var(--line2);border-radius:999px;padding:3px 9px;font-size:12px;color:var(--mid)}
.hr{height:1px;background:var(--line);margin:16px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack{display:grid;gap:10px}
label.f{display:block;font-size:13px;color:var(--dim);margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:#fff;color:#000;
  padding:10px 14px;border-radius:999px;font-size:14px;font-weight:600;z-index:20}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}}
@keyframes pop{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="foot"></div>
<script>
/* ============================================================
   MESOCYCLE — RP-style hypertrophy training engine
   Single file. Data lives on this device. Optional Supabase sync.
   ============================================================ */

/* ---------- Volume landmarks (sets per muscle per week) ---------- */
const M = {
  chest:      {name:"Chest",       mv:8, mev:10, mav:18, mrv:22},
  back:       {name:"Back",        mv:6, mev:10, mav:20, mrv:25},
  quads:      {name:"Quads",       mv:6, mev:8,  mav:16, mrv:20},
  hams:       {name:"Hamstrings",  mv:3, mev:4,  mav:14, mrv:20},
  glutes:     {name:"Glutes",      mv:0, mev:4,  mav:12, mrv:16},
  calves:     {name:"Calves",      mv:6, mev:8,  mav:14, mrv:20},
  biceps:     {name:"Biceps",      mv:5, mev:8,  mav:18, mrv:26},
  triceps:    {name:"Triceps",     mv:4, mev:6,  mav:14, mrv:18},
  sideDelts:  {name:"Side delts",  mv:6, mev:8,  mav:20, mrv:26},
  rearDelts:  {name:"Rear delts",  mv:0, mev:6,  mav:16, mrv:24},
  frontDelts: {name:"Front delts", mv:0, mev:0,  mav:8,  mrv:12},
  traps:      {name:"Traps",       mv:0, mev:4,  mav:16, mrv:26},
  forearms:   {name:"Forearms",    mv:0, mev:2,  mav:10, mrv:16},
  abs:        {name:"Abs",         mv:0, mev:0,  mav:18, mrv:25}
};
const MK = Object.keys(M);

/* ---------- Equipment increments (kg) ---------- */
const INC = {barbell:2.5, cable:2.5, machine:5, dumbbell:2.5, bodyweight:2.5, smith:2.5};

/* ---------- Exercise library ---------- */
const e=(id,name,muscle,equip,lo,hi,fav)=>({id,name,muscle,equip,rep:[lo,hi],fav:!!fav});
const EX = [
  /* chest */
  e("bb-bench","Barbell bench press","chest","barbell",6,10,1),
  e("bb-incline","Incline barbell bench press","chest","barbell",6,10,1),
  e("db-bench","Dumbbell bench press","chest","dumbbell",8,12),
  e("db-incline","Incline dumbbell press","chest","dumbbell",8,12),
  e("mach-press","Machine chest press","chest","machine",8,12),
  e("mach-incline","Incline machine press","chest","machine",8,12),
  e("cable-fly-mid","Mid cable fly","chest","cable",10,15,1),
  e("cable-fly-low","Low to high cable fly","chest","cable",10,15),
  e("cable-fly-high","High to low cable fly","chest","cable",10,15),
  e("pec-deck","Pec deck","chest","machine",10,15),
  e("dip","Chest dip","chest","bodyweight",6,12),
  e("pushup","Push-up","chest","bodyweight",10,20,1),
  /* back */
  e("pulldown-neutral","Neutral-grip pulldown","back","cable",8,12,1),
  e("pulldown-wide","Wide-grip pulldown","back","cable",8,12),
  e("pullup","Pull-up","back","bodyweight",5,10),
  e("csr","Chest-supported row","back","machine",8,12,1),
  e("cable-row","Seated cable row","back","cable",8,12),
  e("db-row","Single-arm dumbbell row","back","dumbbell",8,12),
  e("bb-row","Barbell row","back","barbell",6,10),
  e("tbar","T-bar row","back","machine",8,12),
  e("straight-arm","Straight-arm rope pulldown","back","cable",12,15,1),
  e("lat-prayer","Cable lat pullover","back","cable",12,15),
  /* quads */
  e("leg-press","Leg press","quads","machine",8,15,1),
  e("hack","Hack squat","quads","machine",8,12),
  e("pendulum","Pendulum or belt squat","quads","machine",8,12),
  e("leg-ext","Leg extension","quads","machine",10,15,1),
  e("bb-squat","Barbell back squat","quads","barbell",5,10),
  e("smith-squat","Smith machine squat","quads","smith",8,12),
  e("bw-squat","Bodyweight squat","quads","bodyweight",15,25,1),
  e("split-squat","Bulgarian split squat","quads","dumbbell",8,12),
  e("walking-lunge","Walking lunge","quads","dumbbell",10,15),
  /* hamstrings */
  e("sldl","Stiff-leg deadlift","hams","barbell",6,10,1),
  e("rdl-db","Dumbbell Romanian deadlift","hams","dumbbell",8,12),
  e("leg-curl-seated","Seated leg curl","hams","machine",10,15,1),
  e("leg-curl-lying","Lying leg curl","hams","machine",10,15),
  e("good-morning","Good morning","hams","barbell",8,12),
  e("back-ext","45 degree back extension","hams","bodyweight",10,15),
  /* glutes */
  e("hip-thrust","Barbell hip thrust","glutes","barbell",8,12),
  e("glute-machine","Glute drive machine","glutes","machine",10,15),
  e("cable-kickback","Cable kickback","glutes","cable",12,20),
  e("abduction","Hip abduction machine","glutes","machine",12,20),
  /* calves */
  e("calf-press","Leg press calf raise","calves","machine",10,15,1),
  e("standing-calf","Standing calf raise","calves","machine",10,15),
  e("seated-calf","Seated calf raise","calves","machine",12,20),
  /* biceps */
  e("bb-curl","Barbell curl","biceps","barbell",8,12,1),
  e("db-curl","Standing dumbbell curl","biceps","dumbbell",8,12,1),
  e("bayesian","Bayesian cable curl","biceps","cable",10,15,1),
  e("spider","Spider curl","biceps","dumbbell",10,15,1),
  e("preacher","Preacher curl","biceps","machine",10,15),
  e("incline-curl","Incline dumbbell curl","biceps","dumbbell",10,15),
  e("hammer","Hammer curl","biceps","dumbbell",10,15),
  /* triceps */
  e("vbar-pushdown","V-bar pushdown","triceps","cable",10,15,1),
  e("rope-pushdown","Rope pushdown","triceps","cable",10,15,1),
  e("oh-rope","Overhead rope extension","triceps","cable",10,15,1),
  e("skull","Skullcrusher","triceps","barbell",8,12),
  e("db-oh","Overhead dumbbell extension","triceps","dumbbell",10,15),
  e("close-bench","Close-grip bench press","triceps","barbell",6,10),
  e("dip-tri","Triceps dip","triceps","bodyweight",8,12),
  /* side delts */
  e("cable-lat-raise","Cable lateral raise","sideDelts","cable",12,20,1),
  e("db-lat-raise","Dumbbell lateral raise","sideDelts","dumbbell",12,20,1),
  e("machine-lat-raise","Machine lateral raise","sideDelts","machine",12,20),
  e("upright-row","Cable upright row","sideDelts","cable",10,15),
  /* rear delts */
  e("face-pull","Face pull","rearDelts","cable",12,20,1),
  e("reverse-pec","Reverse pec deck","rearDelts","machine",12,20),
  e("rear-db-fly","Bent-over dumbbell reverse fly","rearDelts","dumbbell",12,20),
  e("cable-rear-fly","Cable reverse fly","rearDelts","cable",12,20),
  /* front delts */
  e("ohp","Standing overhead press","frontDelts","barbell",6,10,1),
  e("db-shoulder","Seated dumbbell shoulder press","frontDelts","dumbbell",8,12,1),
  e("machine-shoulder","Machine shoulder press","frontDelts","machine",8,12),
  e("front-raise","Cable front raise","frontDelts","cable",12,20),
  /* traps */
  e("db-shrug","Dumbbell shrug","traps","dumbbell",10,15),
  e("bb-shrug","Barbell shrug","traps","barbell",10,15),
  e("cable-shrug","Cable shrug","traps","cable",12,20),
  /* forearms */
  e("wrist-curl","Wrist curl","forearms","dumbbell",12,20),
  e("reverse-curl","Reverse curl","forearms","barbell",10,15),
  e("farmer","Farmer carry","forearms","dumbbell",30,60),
  /* abs */
  e("cable-crunch","Cable crunch","abs","cable",10,15),
  e("hanging-leg","Hanging leg raise","abs","bodyweight",8,15),
  e("ab-machine","Ab crunch machine","abs","machine",10,15),
  e("plank","Plank (seconds)","abs","bodyweight",30,60)
];
let CUSTOM=[];
const allEx = () => EX.concat(CUSTOM);
const exById = id => allEx().find(x=>x.id===id) || {id, name:"Removed exercise", muscle:"chest", equip:"machine", rep:[8,12]};

/* ---------- Split templates: day name -> muscles trained ---------- */
const SPLITS = {
  2:{name:"Full body twice", days:[
    {name:"Full body A", m:["chest","back","quads","hams","sideDelts","triceps","biceps","calves","abs"]},
    {name:"Full body B", m:["chest","back","quads","hams","sideDelts","rearDelts","triceps","biceps","glutes","abs"]}
  ]},
  3:{name:"Push / Pull / Legs", days:[
    {name:"Push", m:["chest","frontDelts","sideDelts","triceps"]},
    {name:"Pull", m:["back","rearDelts","biceps","traps","forearms"]},
    {name:"Legs", m:["quads","hams","glutes","calves","abs"]}
  ]},
  4:{name:"Upper / Lower", days:[
    {name:"Upper A", m:["chest","back","sideDelts","rearDelts","frontDelts","triceps","biceps","traps","forearms"]},
    {name:"Lower A", m:["quads","hams","glutes","calves","abs"]},
    {name:"Upper B", m:["chest","back","sideDelts","rearDelts","frontDelts","triceps","biceps","traps","forearms"]},
    {name:"Lower B", m:["quads","hams","glutes","calves","abs"]}
  ]},
  5:{name:"Upper / Lower / Push / Pull / Legs", days:[
    {name:"Upper", m:["chest","back","sideDelts","triceps","biceps"]},
    {name:"Lower", m:["quads","hams","calves"]},
    {name:"Push", m:["chest","frontDelts","sideDelts","triceps"]},
    {name:"Pull", m:["back","rearDelts","biceps","traps","forearms"]},
    {name:"Legs", m:["quads","hams","glutes","calves","abs"]}
  ]},
  6:{name:"Push / Pull / Legs twice", days:[
    {name:"Push A", m:["chest","frontDelts","sideDelts","triceps"]},
    {name:"Pull A", m:["back","rearDelts","biceps","traps"]},
    {name:"Legs A", m:["quads","hams","calves","abs"]},
    {name:"Push B", m:["chest","frontDelts","sideDelts","triceps"]},
    {name:"Pull B", m:["back","rearDelts","biceps","traps","forearms"]},
    {name:"Legs B", m:["quads","hams","glutes","calves","abs"]}
  ]}
};

/* ---------- RIR progression by mesocycle length ---------- */
const RIR = {4:[3,2,1,0], 5:[3,3,2,1,0], 6:[3,3,2,2,1,0]};

/* Sensible defaults so a first build is not a two-hour session */
const DEFAULT_PRI = {
  chest:"grow", back:"grow", quads:"grow", hams:"grow", glutes:"maintain", calves:"grow",
  biceps:"grow", triceps:"grow", sideDelts:"grow", rearDelts:"grow", frontDelts:"maintain",
  traps:"maintain", forearms:"skip", abs:"grow"
};
const rirFor = (weeks, wk) => wk>weeks ? 4 : RIR[weeks][wk-1];
</script>
<style>

.routine h2{margin-bottom:4px}
.routine .meta{color:var(--dim);font-size:13px}
.routine[data-due="1"]{border-color:#fff}

<script>
/* ============================================================
   STATE
   ============================================================ */
const KEY="mesocycle.state.v2";
let S = load() || fresh();
if(!S.custom) S.custom=[];
CUSTOM = S.custom;
let UI = {tab:"home", wizard:null, toast:null, pickFor:null, draft:{}, view:null, histId:null, cal:null, calDay:null,
          search:"", newEx:null, exHist:null, editing:false, warmMark:{}, focus:null, ask:null, newRoutine:null};
let tick=null;

function fresh(){ return {v:2, meso:null, active:null, custom:[], cfg:{url:"",key:"",email:""}, updated:0}; }
function load(){
  try{
    let r=localStorage.getItem(KEY);
    if(!r){ const old=localStorage.getItem("mesocycle.state.v1"); if(old) return migrate(JSON.parse(old)); }
    return r?JSON.parse(r):null;
  }catch(err){ return null; }
}
function migrate(o){
  const s={v:2, meso:o.meso||null, active:null, cfg:o.cfg||{url:"",key:"",email:""}, updated:Date.now()};
  if(s.meso){
    s.meso.sessions = s.meso.sessions || [];
    if(s.meso.log){
      Object.keys(s.meso.log).forEach(k=>{
        const [w,di,si]=k.split("-").map(Number);
        let sess=s.meso.sessions.find(x=>x.week===w && x.di===di);
        if(!sess){ sess={id:"m"+w+"-"+di, di, week:w, start:null, end:null, entries:{}, finished:true}; s.meso.sessions.push(sess); }
        sess.entries[si]=s.meso.log[k];
      });
      delete s.meso.log;
    }
  }
  return s;
}
function syncCustom(){ CUSTOM = S.custom || (S.custom=[]); }
function save(push){
  S.updated=Date.now();
  syncCustom();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(err){ toast("Storage full. Export a backup."); }
  if(push!==false) queueSync();
}

/* ============================================================
   ENGINE
   ============================================================ */
function startSets(mk, priority){
  const L=M[mk];
  if(priority==="skip") return 0;
  if(priority==="maintain") return L.mv;
  const base = L.mev>0 ? L.mev : Math.round(L.mav*0.4);
  if(priority==="grow") return base;
  if(priority==="priority") return Math.min(base+3, L.mav);
  return base;
}

function buildMeso(cfg){
  const tpl=SPLITS[cfg.daysPerWeek];
  const days=tpl.days.map(d=>({name:d.name, slots:[]}));
  MK.forEach(mk=>{
    const weekly=startSets(mk, cfg.priorities[mk]||DEFAULT_PRI[mk]||"grow");
    if(weekly<=0) return;
    const idxs=tpl.days.map((d,i)=>d.m.includes(mk)?i:-1).filter(i=>i>=0);
    if(!idxs.length) return;
    const per=Math.max(2, Math.round(weekly/idxs.length));
    idxs.forEach((i,dayN)=>{
      const nEx=Math.min(2, Math.max(1, Math.ceil(per/3)));
      const picks=pickExercises(mk, nEx, cfg.favouritesFirst, dayN);
      let left=per;
      picks.forEach((ex,j)=>{
        const sets = j===picks.length-1 ? left : Math.ceil(per/picks.length);
        left-=sets;
        if(sets>0) days[i].slots.push({muscle:mk, exId:ex.id, sets});
      });
    });
  });
  days.forEach(d=>{ trimDay(d); d.slots.sort((a,b)=>order(a.muscle)-order(b.muscle)); });

  const meso={
    name: cfg.name || tpl.name,
    weeks: cfg.weeks,
    started: new Date().toISOString().slice(0,10),
    priorities: cfg.priorities,
    days, week:1,
    plan:{}, fb:{}, done:{}, notes:{}, sessions:[]
  };
  meso.plan[1]=days.map(d=>d.slots.map(s=>s.sets));
  return meso;
}
function order(mk){ return MK.indexOf(mk); }
function trimDay(day){
  const MAXEX=8;
  while(day.slots.length>MAXEX){
    const counts={}; day.slots.forEach(s=>counts[s.muscle]=(counts[s.muscle]||0)+1);
    const worst=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];
    if(counts[worst]<2) break;
    const mine=day.slots.filter(s=>s.muscle===worst);
    const total=Math.min(5, mine.reduce((a,s)=>a+s.sets,0));
    const keep=mine[0]; keep.sets=total;
    day.slots=day.slots.filter(s=>s.muscle!==worst || s===keep);
  }
}
function pickExercises(mk,n,favFirst,rotate){
  let pool=EX.filter(x=>x.muscle===mk);
  if(favFirst) pool=pool.slice().sort((a,b)=>(b.fav?1:0)-(a.fav?1:0));
  const off=(rotate||0)%pool.length;
  return pool.slice(off).concat(pool.slice(0,off)).slice(0,n);
}

const planWeek = () => Math.min(S.meso.week, S.meso.weeks+1);
function plannedSets(di,si){ const p=S.meso.plan[planWeek()]; return (p && p[di] && p[di][si]) || 0; }

function weekSets(mk, wk){
  const p=S.meso.plan[wk]; if(!p) return 0;
  let t=0;
  S.meso.days.forEach((d,di)=>d.slots.forEach((s,si)=>{ if(s.muscle===mk) t+=(p[di]||[])[si]||0; }));
  return t;
}
function countSessions(mk){ return S.meso.days.filter(d=>d.slots.some(s=>s.muscle===mk)).length || 1; }

/* Most recent finished session for this routine that logged this slot */
function lastEntry(di,si,beforeId){
  const ss=S.meso.sessions.filter(x=>x.finished && x.di===di && x.entries && (x.entries[si]||[]).some(y=>!y.warm));
  for(let i=ss.length-1;i>=0;i--){ if(!beforeId || ss[i].id!==beforeId) return ss[i]; }
  return null;
}
function lastSessionFor(di){
  const ss=S.meso.sessions.filter(x=>x.finished && x.di===di);
  return ss.length?ss[ss.length-1]:null;
}

/* Carry this week's plan into next week. You change the sets yourself. */
function progressWeek(fromWk){
  const meso=S.meso, toWk=fromWk+1;
  meso.plan[toWk]=meso.plan[fromWk].map(day=>day.slice());
  const notes=[];
  MK.forEach(mk=>{
    const n=weekSets(mk,toWk); if(!n) return;
    if(n>=M[mk].mrv) notes.push(M[mk].name+" is at maximum recoverable volume ("+n+" sets). Hold here or deload.");
    else if(n<M[mk].mev) notes.push(M[mk].name+" is below minimum effective volume ("+n+" of "+M[mk].mev+" sets).");
  });
  notes.push("Sets carried over from week "+fromWk+". Adjust them on the Mesocycle tab.");
  meso.notes[toWk]=notes;
  return notes;
}

function buildDeload(){
  const meso=S.meso;
  const base=meso.plan[meso.weeks]||meso.plan[planWeek()];
  meso.plan[meso.weeks+1]=base.map(day=>day.map(n=>n>0?Math.max(1,Math.floor(n/2)):0));
  meso.notes[meso.weeks+1]=["Deload week. Half the sets, about 55 per cent of your usual load, stop four or five reps short."];
}

function target(di,si){
  const meso=S.meso, slot=meso.days[di].slots[si], ex=exById(slot.exId);
  const inc=INC[ex.equip]||2.5, wk=meso.week, tRir=rirFor(meso.weeks,wk), deload=wk>meso.weeks;
  const prevSess=lastEntry(di,si, S.active?S.active.id:null);
  if(!prevSess) return {weight:null, reps:ex.rep[0], rir:tRir, note:"First time. Find a weight you can hold for "+ex.rep[0]+" to "+ex.rep[1]+" reps at "+tRir+" reps in reserve."};
  const arr=(prevSess.entries[si]||[]).filter(x=>!x.warm);
  if(!arr.length) return {weight:null, reps:ex.rep[0], rir:tRir, note:"Only warm-ups logged last time."};
  const best=arr[arr.length-1];
  if(deload) return {weight:round(best.w*0.55,inc), reps:Math.max(ex.rep[0],best.r-2), rir:4, note:"Deload load."};
  const easy = best.rir > tRir;
  if(best.r>=ex.rep[1] || (easy && best.r>=ex.rep[1]-1))
    return {weight:round(best.w+inc,inc), reps:ex.rep[0], rir:tRir, note:"You topped the rep range. Add weight, back to "+ex.rep[0]+" reps."};
  const addReps = easy?2:1;
  return {weight:round(best.w,inc), reps:Math.min(ex.rep[1],best.r+addReps), rir:tRir, note:"Same weight, chase "+Math.min(ex.rep[1],best.r+addReps)+" reps."};
}
function round(x,inc){ return Math.round(x/inc)*inc; }

function sessionMuscles(di){
  const seen=[];
  S.meso.days[di].slots.forEach((s,si)=>{ if(!s.hidden && plannedSets(di,si)>0 && !seen.includes(s.muscle)) seen.push(s.muscle); });
  return seen;
}
function weekDone(wk,di){ return !!S.meso.done[wk+"-"+di]; }
function weekComplete(wk){ return S.meso.days.every((d,i)=>d.hidden || weekDone(wk,i)); }
function sessionVolume(sess){
  let v=0, sets=0;
  Object.values(sess.entries||{}).forEach(a=>a.forEach(s=>{ if(s.warm) return; v+=s.w*s.r; sets++; }));
  return {volume:Math.round(v), sets};
}

/* Every set ever performed on an exercise, newest last */
function exerciseHistory(exId){
  const out=[];
  S.meso.sessions.filter(s=>s.finished).forEach(s=>{
    S.meso.days[s.di].slots.forEach((slot,si)=>{
      if(slot.exId!==exId) return;
      const sets=((s.entries||{})[si]||[]).filter(x=>!x.warm);
      if(sets.length) out.push({date:s.end||s.start, day:S.meso.days[s.di].name, week:s.week, sets});
    });
  });
  return out.sort((a,b)=>new Date(a.date)-new Date(b.date));
}
const e1rm = s => s.w*(1+(s.r+ (s.rir||0))/30);

/* Plates per side, 20 kg bar */
function plates(total){
  let per=(total-20)/2;
  if(per<=0) return null;
  const sizes=[25,20,15,10,5,2.5,1.25], out=[];
  sizes.forEach(x=>{ while(per>=x-0.001){ out.push(x); per=Math.round((per-x)*100)/100; } });
  return out.length?out.join(" + "):null;
}

let sb=null, syncTimer=null;
async function initSync(){
  if(!S.cfg.url || !S.cfg.key) return null;
  if(sb) return sb;
  const mod=await import("https://esm.sh/@supabase/supabase-js@2");
  sb=mod.createClient(S.cfg.url, S.cfg.key);
  return sb;
}
function queueSync(){ if(!S.cfg.url||!S.cfg.key) return; clearTimeout(syncTimer); syncTimer=setTimeout(pushRemote,2500); }
async function pushRemote(){
  try{
    const c=await initSync(); if(!c) return;
    const {data:{user}}=await c.auth.getUser(); if(!user) return;
    await c.from("training_state").upsert({user_id:user.id, data:S, updated_at:new Date().toISOString()});
  }catch(err){ console.warn("sync push failed",err); }
}
async function pullRemote(silent){
  try{
    const c=await initSync(); if(!c){ if(!silent) toast("Add your Supabase details first."); return; }
    const {data:{user}}=await c.auth.getUser();
    if(!user){ if(!silent) toast("Sign in first."); return; }
    const {data}=await c.from("training_state").select("data").eq("user_id",user.id).maybeSingle();
    if(data&&data.data&&(data.data.updated||0)>(S.updated||0)){ S=data.data; save(false); render(); toast("Pulled from cloud."); }
    else if(!silent) toast("This device is already current.");
  }catch(err){ if(!silent) toast("Sync failed. Check your keys."); }
}
async function signIn(email){
  const c=await initSync(); if(!c){ toast("Add your Supabase details first."); return; }
  const {error}=await c.auth.signInWithOtp({email, options:{emailRedirectTo:location.href.split("#")[0]}});
  toast(error?"Could not send the link.":"Check your email for the sign-in link.");
}
async function whoami(){
  try{ const c=await initSync(); if(!c) return null; const {data:{user}}=await c.auth.getUser(); return user?user.email:null; }catch(err){ return null; }
}

const DAYNAMES=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function dstamp(iso){ const d=new Date(iso); return DAYNAMES[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()]; }
function tstamp(iso){ const d=new Date(iso); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function dkey(iso){ const d=new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function ago(iso){
  const days=Math.floor((Date.now()-new Date(iso))/86400000);
  return days<=0?"today":days===1?"yesterday":days+" days ago";
}
function dur(ms){
  const s=Math.floor(ms/1000), m=Math.floor(s/60);
  return m<60 ? m+" min" : Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m";
}
function clockText(){
  if(!S.active||!S.active.start) return "";
  const s=Math.floor((Date.now()-new Date(S.active.start))/1000);

}

/* ---------- Live session ---------- */
function viewSession(){
  const a=S.active, m=S.meso, di=a.di, day=m.days[di];
  let body="";

  day.slots.forEach((slot,si)=>{
    const sets=plannedSets(di,si);
    if(slot.hidden || sets<=0) return;
    const ex=exById(slot.exId), t=target(di,si);
    const prevSess=lastEntry(di,si,a.id), prev=prevSess?(prevSess.entries[si]||[]).filter(x=>!x.warm):null;
    const log=a.entries[si]||[];
    let rows="";
    for(let i=0;i<Math.max(sets,log.length);i++){
      const s=log[i], done=!!s, p=prev&&prev[i];
      const carry = (!done && i>0 && log[i-1]) ? log[i-1] : null;
      const phW = carry?fmt(carry.w):(t.weight!=null?fmt(t.weight):"kg");
      const phR = carry?carry.r:t.reps;
      const phRir = carry?carry.rir:t.rir;
      rows+=`${p?`<div class="setgrid"><span></span><div class="prev">last time ${fmt(p.w)} kg &times; ${p.r} @ ${p.rir} RIR</div><span></span></div>`:""}
      <div class="setrow ${done?"done":""}">
        <button class="idx ${(s&&s.warm)||UI.warmMark[si+"-"+i]?"warm":""}" data-warm="${si}-${i}" aria-label="Mark set ${i+1} as a warm-up">${(s&&s.warm)||UI.warmMark[si+"-"+i]?"W":i+1}</button>
        <input inputmode="decimal" data-in="w" data-si="${si}" data-i="${i}" value="${done?fmt(s.w):h(UI.draft[si+"-"+i+"-w"]||"")}" placeholder="${phW}" aria-label="Weight set ${i+1}">
        <input inputmode="numeric" data-in="r" data-si="${si}" data-i="${i}" value="${done?s.r:h(UI.draft[si+"-"+i+"-r"]||"")}" placeholder="${phR}" aria-label="Reps set ${i+1}">
        <input inputmode="numeric" data-in="rir" data-si="${si}" data-i="${i}" value="${done?s.rir:h(UI.draft[si+"-"+i+"-rir"]||"")}" placeholder="${phRir}" aria-label="Reps in reserve set ${i+1}">
        <button class="tick" data-logset="${si}" data-i="${i}">${done?"&check;":"Log"}</button>
      </div>${done && !s.warm && p && (s.w*s.r > p.w*p.r) ? `<div class="metaline" style="margin:-4px 0 6px">Better than last time<span class="pb">PB</span></div>`:""}`;
    }
    const pl = (ex.equip==="barbell"||ex.equip==="smith") && t.weight!=null ? plates(t.weight) : null;
    body+=`<div class="card">
      ${slot.ss?`<div class="sslabel">Superset with ${h(exById(day.slots[si-1].exId).name)}</div>`:""}
      <div class="row sb"><button style="text-align:left" data-exhist="${h(slot.exId)}"><h2>${h(ex.name)}</h2></button>
        <button class="pill" data-swap="${di}-${si}">Swap</button></div>
      <div class="row" style="align-items:baseline;gap:12px;margin-top:8px">
        <span class="big">${t.weight!=null?fmt(t.weight):"&mdash;"}</span><span class="muted">kg &times; ${t.reps} reps @ ${t.rir} RIR</span></div>
      <div class="metaline">${h(t.note)}${pl?" Plates per side: "+pl+".":""}</div>
      <div class="setgrid" style="margin-top:12px"><span></span>

function viewCalendar(sessions){
  const now=new Date();
  const c=UI.cal||(UI.cal={y:now.getFullYear(), m:now.getMonth()});
  const first=new Date(c.y,c.m,1);
  const lead=(first.getDay()+6)%7;                      // weeks start on Monday
  const days=new Date(c.y,c.m+1,0).getDate();
  const byDay={};
  sessions.forEach(s=>{ const k=dkey(s.end||s.start); (byDay[k]=byDay[k]||[]).push(s); });
  const todayKey=dkey(new Date().toISOString());
  let cells="";
  for(let i=0;i<lead;i++) cells+=`<span class="day empty"></span>`;
  for(let n=1;n<=days;n++){
    const k=c.y+"-"+String(c.m+1).padStart(2,"0")+"-"+String(n).padStart(2,"0");
    const has=!!byDay[k];
    cells+=`<button class="day ${has?"has":""} ${k===todayKey?"today":""}" data-pickday="${k}" aria-pressed="${UI.calDay===k}" ${has?"":"disabled"}>
      ${n}${has?`<i></i>`:""}</button>`;
  }
  return `<div class="card">
    <div class="calhead">
      <button data-cal="-1" aria-label="Previous month">&lsaquo;</button>
      <strong>${MONTHS[c.m]} ${c.y}</strong>
      <button data-cal="1" aria-label="Next month">&rsaquo;</button>
    </div>
    <div class="cal">${["M","T","W","T","F","S","S"].map(x=>`<span class="wd">${x}</span>`).join("")}${cells}</div>
  </div>`;
}

          <table><tbody>

      }).join("")}

  return `<div class="top"><h1>History</h1><span class="sub">${ss.length} sessions</span></div>

/* ---------- Exercise history ---------- */
function viewExHistory(){
  const ex=exById(UI.exHist), hist=exerciseHistory(UI.exHist);
  const pts=hist.map(x=>{ const best=x.sets.reduce((a,b)=>e1rm(b)>e1rm(a)?b:a); return {d:x.date, v:e1rm(best), w:best.w, r:best.r}; });
  let chart="";
  if(pts.length>1){
    const vals=pts.map(p=>p.v), lo=Math.min(...vals)*0.97, hi=Math.max(...vals)*1.03;
    const W=320, H=110;
    const path=pts.map((p,i)=>{
      const x=8+i*(W-16)/(pts.length-1), y=H-8-((p.v-lo)/(hi-lo))*(H-24);
      return (i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1);
    }).join(" ");
    const dots=pts.map((p,i)=>{
      const x=8+i*(W-16)/(pts.length-1), y=H-8-((p.v-lo)/(hi-lo))*(H-24);
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#fff"/>`;
    }).join("");
    chart=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Estimated one rep max over time">
      <path d="${path}" fill="none" stroke="#fff" stroke-width="2"/>${dots}</svg>
      <p class="metaline">Estimated one rep max, ${fmt(pts[0].v)} kg to ${fmt(pts[pts.length-1].v)} kg.</p>`;
  }
  return `<div class="top"><h1>${h(ex.name)}</h1><span class="sub">${h(M[ex.muscle].name)}</span></div>
  <div class="wrap">
    ${hist.length?`<div class="card"><h2>Progress</h2>${chart||`<p class="dim">One session so far. The chart appears from the second.</p>`}</div>`:""}
    ${hist.slice().reverse().map(x=>`<div class="card">
      <div class="row sb"><h2>${dstamp(x.date)}</h2><span class="dim">${h(x.day)}, week ${x.week}</span></div>
      <table><tbody>${x.sets.map((s,i)=>`<tr><td class="dim">Set ${i+1}</td><td class="n">${fmt(s.w)} kg &times; ${s.r} @ ${s.rir} RIR</td></tr>`).join("")}</tbody></table>
    </div>`).join("") || `<div class="card flat dim">No sets logged on this exercise yet.</div>`}
    <button class="btn" data-closeex="1">Back</button></div>`;
}

/* ============================================================
   EVENTS
   ============================================================ */
function doAct(act, arg){
  const m=S.meso;
  if(act==="discard"){ S.active=null; UI.draft={}; UI.warmMark={}; save(); toast("Session discarded."); return; }
  if(act==="removeex"){
    const [di,si]=arg.split("-").map(Number);
    m.plan[planWeek()][di][si]=0; m.days[di].slots[si].hidden=true; save(); return;
  }
  if(act==="delroutine"){
    const di=+arg;
    if(m.days.filter(x=>!x.hidden).length<=1){ toast("Keep at least one routine."); return; }
    m.days[di].hidden=true; save(); toast("Routine deleted."); return;
  }
  if(act==="delsession"){ m.sessions=m.sessions.filter(x=>x.id!==arg); UI.histId=null; UI.editing=false; save(); toast("Session deleted."); return; }
  if(act==="newmeso"){ UI.wizard=null; S.meso=null; S.active=null; save(); return; }
  if(act==="reset"){
    localStorage.removeItem(KEY); localStorage.removeItem("mesocycle.state.v1");
    S=fresh(); syncCustom();
    UI={tab:"home",wizard:null,toast:null,pickFor:null,draft:{},histId:null,cal:null,calDay:null,search:"",newEx:null,exHist:null,editing:false,warmMark:{},focus:null,ask:null,newRoutine:null};
    return;
  }
}

document.addEventListener("click", async ev=>{
  const b=ev.target.closest("button"); if(!b) return;
  const d=b.dataset;

  if(d.askyes){ const a=UI.ask; UI.ask=null; if(a) doAct(a.act, a.arg); render(); return; }
  if(d.askno){ UI.ask=null; render(); return; }

  if(d.newroutine){ UI.newRoutine={di:null, name:""}; render(); return; }
  if(d.renameroutine){ UI.newRoutine={di:+d.renameroutine, name:S.meso.days[+d.renameroutine].name}; render(); return; }
  if(d.cancelroutine){ UI.newRoutine=null; render(); return; }
  if(d.saveroutine){
    const name=$("#rtname").value.trim();
    if(!name){ toast("Give it a name."); return; }
    if(UI.newRoutine.di!=null){ S.meso.days[UI.newRoutine.di].name=name; }
    else{
      S.meso.days.push({name, slots:[]});
      const di=S.meso.days.length-1;
      Object.keys(S.meso.plan).forEach(w=>{ S.meso.plan[w][di]=[]; });
    }
    UI.newRoutine=null; save(); render(); return;
  }
  if(d.delroutine){ ask("Delete "+S.meso.days[+d.delroutine].name+"? Past sessions are kept.", "delroutine", d.delroutine, true); return; }

  if(d.tab){ UI.tab=d.tab; UI.pickFor=null; UI.histId=null; UI.exHist=null; UI.editing=false; UI.focus=null; window.scrollTo(0,0); render(); return; }
  if(d.exhist){ UI.exHist=d.exhist; UI.focus=null; window.scrollTo(0,0); render(); return; }
  if(d.closeex){ UI.exHist=null; window.scrollTo(0,0); render(); return; }

  if(d.newex){ UI.newEx={muscle:"chest", equip:"machine", lo:8, hi:12, name:""}; UI.focus=null; render(); return; }
  if(d.cancelnewex){ UI.newEx=null; render(); return; }
  if(d.savenewex){
    const name=$("#nxname").value.trim();
    if(!name){ toast("Give it a name."); return; }
    const lo=parseInt($("#nxlo").value,10)||8, hi=parseInt($("#nxhi").value,10)||12;
    const ex={id:"c"+Date.now(), name, muscle:$("#nxmuscle").value, equip:$("#nxequip").value, rep:[Math.min(lo,hi), Math.max(lo,hi)], fav:true};
    S.custom.push(ex); syncCustom(); UI.newEx=null; UI.search=name;
    save(); render(); toast("Exercise saved."); return;
  }

  if(d.warm){
    const [si,i]=d.warm.split("-").map(Number), a=S.active;
    const lg=(a.entries[si]||[]);
    if(lg[i]){ lg[i].warm=!lg[i].warm; }
    else { const k=si+"-"+i; UI.warmMark[k]=!UI.warmMark[k]; }
    save(); render(); return;
  }

  if(d.ss){
    const [di,si]=d.ss.split("-").map(Number), slot=S.meso.days[di].slots[si];
    slot.ss=!slot.ss; save(); render(); return;
  }

  if(d.eedit){ UI.editing=true; window.scrollTo(0,0); render(); return; }
  if(d.ecancel){ UI.editing=false; render(); return; }
  if(d.erate){ const s=S.meso.sessions.find(x=>x.id===UI.histId); if(s){ s.rating=+d.erate; save(); render(); } return; }
  if(d.ewarm){
    const [si,i]=d.ewarm.split("-").map(Number), s=S.meso.sessions.find(x=>x.id===UI.histId);
    if(s && s.entries[si] && s.entries[si][i]){ s.entries[si][i].warm=!s.entries[si][i].warm; save(); render(); }
    return;
  }
  if(d.edrop){
    const [si,i]=d.edrop.split("-").map(Number), s=S.meso.sessions.find(x=>x.id===UI.histId);
    if(s && s.entries[si]){ s.entries[si].splice(i,1); save(); render(); }
    return;
  }
  if(d.esave){
    const s=S.meso.sessions.find(x=>x.id===UI.histId);
    if(!s) return;
    document.querySelectorAll("[data-e]").forEach(el=>{
      const si=el.dataset.si, i=+el.dataset.i, f=el.dataset.e;
      if(!s.entries[si] || !s.entries[si][i]) return;
      const v=f==="w"?parseFloat(el.value):parseInt(el.value,10);
      if(!isNaN(v)) s.entries[si][i][f]=v;
    });
    UI.editing=false; save(); render(); toast("Session updated."); return;
  }
  if(d.edelete){ ask("Delete this session? It cannot be recovered.", "delsession", UI.histId, true); return; }

  if(d.csv){
    const rows=[["date","time","routine","week","exercise","set","warm_up","kg","reps","rir","session_rating"]];
    S.meso.sessions.filter(x=>x.finished).forEach(s=>{
      const day=S.meso.days[s.di];
      Object.keys(s.entries||{}).forEach(si=>{
        const slot=day.slots[si]; if(!slot) return;
        (s.entries[si]||[]).forEach((x,i)=>rows.push([
          dkey(s.end||s.start), tstamp(s.start||s.end), day.name, s.week,
          exById(slot.exId).name, i+1, x.warm?"yes":"no", x.w, x.r, x.rir, s.rating!=null?RATING[s.rating]:""
        ]));
      });
    });
    const csv=rows.map(r=>r.map(c=>/[",]/.test(String(c))?'"'+String(c).replace(/"/g,'""')+'"':c).join(",")).join("\n");
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    a.download="mesocycle-sessions-"+new Date().toISOString().slice(0,10)+".csv"; a.click();
    URL.revokeObjectURL(a.href); return;
  }
  if(d.days){ UI.wizard.daysPerWeek=+d.days; render(); return; }
  if(d.weeks){ UI.wizard.weeks=+d.weeks; render(); return; }
  if(d.pri){ UI.wizard.priorities[d.pri]=d.val; render(); return; }
  if(d.go){ const nm=$("#mesoname"); if(nm) UI.wizard.name=nm.value; UI.wizard.step=+d.go; window.scrollTo(0,0); render(); return; }
  if(d.create){
    const nm=$("#mesoname"); if(nm) UI.wizard.name=nm.value;
    S.meso=buildMeso(UI.wizard); UI.wizard=null; UI.tab="home"; save(); window.scrollTo(0,0); render(); return;
  }

  if(d.start!=null && d.start!==""){
    const di=+d.start;
    S.active={id:"s"+Date.now(), di, week:S.meso.week, start:new Date().toISOString(), entries:{}, rating:null, finished:false, finishing:false};
    UI.draft={}; UI.warmMark={}; save(); window.scrollTo(0,0); render(); return;
  }

  if(d.rate!=null && d.rate!==""){ if(S.active){ S.active.rating=+d.rate; save(); render(); } return; }

  if(d.logset!=null && d.logset!==""){
    const si=+d.logset, i=+d.i, a=S.active;
    const row=b.closest(".setrow"), g=n=>row.querySelector('[data-in="'+n+'"]');
    const lg=a.entries[si]||(a.entries[si]=[]);
    if(lg[i]){ lg.splice(i,1); save(); render(); return; }
    const w=parseFloat(g("w").value||g("w").placeholder);
    const r=parseInt(g("r").value||g("r").placeholder,10);
    const rirRaw=g("rir").value===""?g("rir").placeholder:g("rir").value;
    const rir=parseInt(rirRaw,10);
    if(isNaN(w)||isNaN(r)){ toast("Enter a weight and reps."); return; }
    lg[i]={w,r,rir:isNaN(rir)?0:rir};
    if(UI.warmMark[si+"-"+i]){ lg[i].warm=true; delete UI.warmMark[si+"-"+i]; }
    ["w","r","rir"].forEach(f=>delete UI.draft[si+"-"+i+"-"+f]);
    save(); render(); return;
  }
  if(d.addset!=null && d.addset!==""){
    const si=+d.addset;
    S.meso.plan[planWeek()][S.active.di][si]++;
    save(); render(); return;
  }

  if(d.finishsession){ S.active.finishing=true; window.scrollTo(0,0); save(); render(); return; }
  if(d.backtosession){ S.active.finishing=false; window.scrollTo(0,0); render(); return; }
  if(d.discard){ ask("Discard this session? Nothing is saved.", "discard", null, true); return; }
  if(d.savesession){
    const a=S.active, m=S.meso;
    const logged=Object.values(a.entries).some(x=>x.length);
    if(!logged){ toast("Nothing logged. Discard instead."); return; }
    a.end=new Date().toISOString(); a.finished=true; delete a.finishing;
    m.done[a.week+"-"+a.di]=true;
    m.sessions.push(a); S.active=null; UI.draft={}; UI.warmMark={}; UI.tab="home";
    save(); window.scrollTo(0,0); render();
    toast(weekComplete(m.week)?"Week complete. Close it off on the routines screen.":"Session saved.");
    return;
  }

  if(d.hist){ UI.histId=d.hist; window.scrollTo(0,0); render(); return; }
  if(d.closehist){ UI.histId=null; render(); return; }
  if(d.cal){
    const c=UI.cal, n=c.m+(+d.cal);
    UI.cal={y:c.y+Math.floor(n/12), m:((n%12)+12)%12};
    render(); return;
  }
  if(d.pickday){ UI.calDay = (UI.calDay===d.pickday)?null:d.pickday; render(); return; }
  if(d.clearday){ UI.calDay=null; render(); return; }

  if(d.sets){
    const [di,si]=d.sets.split("-").map(Number), wk=planWeek();
    const v=S.meso.plan[wk][di][si]+(+d.delta);
    S.meso.plan[wk][di][si]=Math.max(0, Math.min(8, v));
    save(); render(); return;
  }
  if(d.remove){
    const [di,si]=d.remove.split("-").map(Number);
    ask("Remove "+exById(S.meso.days[di].slots[si].exId).name+" from "+S.meso.days[di].name+"? Past sessions are kept.", "removeex", d.remove, true);
    return;
  }
  if(d.addex){ UI.pickFor="add-"+d.addex; UI.tab="plan"; window.scrollTo(0,0); render(); return; }
  if(d.swap){ UI.pickFor=d.swap; UI.tab="plan"; window.scrollTo(0,0); render(); return; }
  if(d.pick){
    if(UI.pickFor.startsWith("add-")){
      const di=+UI.pickFor.slice(4), ex=exById(d.pick);
      S.meso.days[di].slots.push({muscle:ex.muscle, exId:ex.id, sets:3});
      const ni=S.meso.days[di].slots.length-1;
      Object.keys(S.meso.plan).forEach(w=>{ if(S.meso.plan[w][di]) S.meso.plan[w][di][ni]=0; });
      S.meso.plan[planWeek()][di][ni]=3;
    } else {
      const [di,si]=UI.pickFor.split("-").map(Number);
      S.meso.days[di].slots[si].exId=d.pick;
    }
    UI.pickFor=null; UI.search=""; UI.focus=null; save(); render(); return;
  }
  if(d.cancelpick){ UI.pickFor=null; UI.search=""; UI.focus=null; render(); return; }

  if(d.nextweek){
    const m=S.meso, wk=m.week;
    if(wk<m.weeks){ progressWeek(wk); m.week=wk+1; }
    else if(wk===m.weeks){ buildDeload(); m.week=wk+1; }
    else m.week=wk+1;
    save(); window.scrollTo(0,0); render();
    toast(m.week>m.weeks+1?"Block finished.":"Week "+m.week+" is ready.");
    return;
  }
  if(d.newmeso){ ask("Start a new mesocycle? The current plan is replaced.", "newmeso", null, true); return; }

  if(d.savecfg){ S.cfg.url=$("#sburl").value.trim().replace(/\/$/,""); S.cfg.key=$("#sbkey").value.trim(); sb=null; save(false); toast("Saved."); render(); return; }
  if(d.signin){ S.cfg.email=$("#sbemail").value.trim(); save(false); signIn(S.cfg.email); return; }
  if(d.pull){ pullRemote(false); return; }
  if(d.push){ await pushRemote(); toast("Pushed."); return; }
  if(d.export){
    const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="mesocycle-backup-"+new Date().toISOString().slice(0,10)+".json"; a.click();
    URL.revokeObjectURL(a.href); return;
  }
  if(d.import){ $("#importfile").click(); return; }
  if(d.reset){ ask("Erase all training data on this device? Cloud data is untouched until the next push.", "reset", null, true); return; }
});

document.addEventListener("change", ev=>{
  if(ev.target.id==="importfile"){
    const f=ev.target.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{ try{ S=JSON.parse(fr.result); if(S.v!==2) S=migrate(S); save(); render(); toast("Imported."); }catch(err){ toast("That file did not parse."); } };
    fr.readAsText(f);
  }
});
document.addEventListener("input", ev=>{
  const t=ev.target;
  if(t.id==="exsearch"){ UI.search=t.value; UI.focus="exsearch"; render(); return; }
  if(t.dataset && t.dataset.in) UI.draft[t.dataset.si+"-"+t.dataset.i+"-"+t.dataset.in]=t.value;
});

/* ============================================================
   BOOT
   ============================================================ */
render();
if(S.cfg.url && S.cfg.key){
  pullRemote(true).then(()=>whoami()).then(em=>{ const el=document.getElementById("who"); if(el) el.textContent = em?"Signed in as "+em:"Not signed in on this device."; });
}
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
</body>
</html>
