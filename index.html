<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0c0b">
<title>Atlas</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0c0b; --surface:#171614; --surface2:#1f1d1a; --line:#2a2724; --line2:#3b3733;
  --ink:#f2efe9; --mid:#a8a29a; --dim:#746e66;
  --acc:#b08d57; --acc-ink:#120f0b; --acc-soft:#6d5636;
  --red:#a3392f;
  --pad:22px;
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --body:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:400 16px/1.55 var(--body);font-variant-numeric:tabular-nums;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
h1,h2{margin:0;font-family:var(--display);font-weight:400;letter-spacing:-0.005em}
h1{font-size:34px;line-height:1.12}
h2{font-size:20px;line-height:1.25}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--surface2);
  border:1px solid var(--line2);border-radius:8px;padding:13px;width:100%}
input::placeholder{color:var(--dim)}
input:focus,select:focus,button:focus-visible{outline:1px solid var(--acc);outline-offset:2px}

.wrap{max-width:540px;margin:0 auto;padding:4px var(--pad) 130px}
.nav{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top)}
.nav .brand{font-family:var(--display);font-size:19px;color:var(--acc);padding:14px var(--pad) 0;font-style:italic}
.nav .row2{display:flex;gap:22px;padding:8px var(--pad) 0;overflow-x:auto}
.nav .row2 button{padding:8px 0 11px;font-size:14px;color:var(--dim);border-bottom:1px solid transparent;white-space:nowrap}
.nav .row2 button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--acc)}
.top{padding:28px var(--pad) 10px;max-width:540px;margin:0 auto;display:flex;align-items:baseline;gap:12px}
.top .sub{color:var(--dim);font-size:13px;margin-left:auto;text-align:right;line-height:1.35}

.card{border:1px solid var(--line);border-radius:10px;padding:20px;margin:14px 0;background:var(--surface)}
.card.flat{background:transparent;border-style:dashed}
.row{display:flex;gap:12px;align-items:center}
.row.sb{justify-content:space-between}
.muted{color:var(--mid)} .dim{color:var(--dim);font-size:13px}
.big{font-family:var(--display);font-size:56px;line-height:.95;font-weight:300}
.metaline{font-size:13px;color:var(--dim);margin-top:8px;line-height:1.5}
.hr{height:1px;background:var(--line);margin:18px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stack{display:grid;gap:14px}
label.f{display:block;font-size:13px;color:var(--dim);margin-bottom:7px}

.btn{border:1px solid var(--line2);border-radius:8px;padding:15px;text-align:center;display:block;width:100%;margin-top:12px}
.btn.solid{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.btn.small{padding:9px 14px;width:auto;font-size:14px;margin-top:0}
.pill{border:1px solid var(--line2);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--mid)}
.pill.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}

.opts{display:grid;gap:9px;margin-top:12px}
.opt{border:1px solid var(--line);border-radius:9px;padding:14px;text-align:left;background:var(--surface2)}
.opt[aria-pressed="true"]{border-color:var(--acc)}
.opt .k{font-weight:500} .opt .d{display:block;color:var(--dim);font-size:13px;margin-top:3px}
.seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:12px 4px;font-size:14px;border-right:1px solid var(--line2);color:var(--mid)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);font-weight:600}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:400;color:var(--dim);padding:7px 4px;border-bottom:1px solid var(--line)}
td{padding:12px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}

.setgrid,.setrow{display:grid;grid-template-columns:34px 1fr 1fr 1fr 54px;gap:8px;align-items:center}
.setrow{margin:10px 0}
.setrow input{padding:15px 8px;text-align:center;font-size:17px}
.setrow .idx{border:1px solid transparent;border-radius:6px;height:34px;color:var(--dim);font-size:14px}
.setrow .idx.warm{border-color:var(--line2);color:var(--mid);font-size:11px}
.setrow .tick{border:1px solid var(--line2);border-radius:8px;height:51px;font-size:14px}
.setrow.done input{border-color:var(--line);color:var(--mid);background:#141210}
.setrow.done .tick{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.prev{grid-column:2 / 5;font-size:12px;color:var(--dim);text-align:center;margin:-2px 0 2px;font-style:italic}
.pb{font-size:11px;color:var(--acc-ink);background:var(--acc);border-radius:999px;padding:2px 8px;margin-left:7px;font-weight:600}
.done-line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;text-align:left;
  border-bottom:1px solid var(--line);padding:15px 2px;margin:0;background:transparent}
.done-line .nm{font-family:var(--display);font-size:17px;color:var(--mid)}
.done-line .vals{font-size:13px;color:var(--dim)}
.sslabel{font-size:12px;color:var(--mid);border-left:2px solid var(--acc);padding-left:10px;margin-bottom:10px;font-style:italic}

.bar{height:3px;background:var(--surface2);border-radius:2px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc)}
.bar i.over{background:var(--red)}

.routine{border-bottom:1px solid var(--line);margin:0;background:transparent}
.routine .go{display:block;width:100%;text-align:left;padding:20px 2px 6px}
.routine .meta{color:var(--dim);font-size:13px;margin-top:5px}
.routine .tools{display:flex;gap:10px;flex-wrap:wrap;padding:0 2px 18px}

.foot{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--bg) 66%,transparent);
  padding:16px var(--pad) calc(16px + env(safe-area-inset-bottom));z-index:8}
.foot .inner{max-width:540px;margin:0 auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--acc);color:var(--acc-ink);
  padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:20}
.scrim{position:fixed;inset:0;background:rgba(6,5,4,.84);display:flex;align-items:center;justify-content:center;padding:22px;z-index:30}
.sheet{background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:22px;max-width:420px;width:100%}
.sheet p{margin:0 0 16px;color:var(--mid)}

.clockbar{display:flex;align-items:baseline;gap:14px}
.clock{font-family:var(--display);font-size:21px;color:var(--acc)}
.hist{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:16px 2px;width:100%;text-align:left}
.hist strong{font-family:var(--display);font-size:17px;font-weight:400}
.hist .d{color:var(--dim);font-size:13px}
.calwrap{padding:4px 0 20px;border-bottom:1px solid var(--line);margin-bottom:4px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.calhead button{border:1px solid var(--line2);border-radius:8px;width:38px;height:38px}
.calhead strong{font-family:var(--display);font-weight:400;font-size:19px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;width:100%}
.cal>*{min-width:0}
.cal .wd{text-align:center;font-size:11px;color:var(--dim);padding-bottom:6px}
.cal .day{aspect-ratio:1;border:1px solid transparent;border-radius:8px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;font-size:14px;color:var(--dim)}
.cal .day.has{color:var(--ink);border-color:var(--line2)}
.cal .day:disabled{cursor:default}
.cal .day.today{border-color:var(--acc-soft)}
.cal .day[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.cal .day i{width:4px;height:4px;border-radius:50%;background:var(--acc);display:block}
.cal .day[aria-pressed="true"] i{background:var(--acc-ink)}
.cal .day.empty{opacity:.18}
.faces{display:flex;justify-content:space-between;gap:7px;margin-top:14px}
.facebtn{border:1px solid var(--line2);border-radius:9px;padding:10px 4px;flex:1;display:flex;justify-content:center}
.facebtn[aria-pressed="true"]{background:var(--acc);border-color:var(--acc)}
.step{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.step button{border:1px solid var(--line2);border-radius:7px;width:36px;height:36px;font-size:18px;line-height:1}
.step .v{min-width:22px;text-align:center;font-family:var(--display);font-size:19px}
.chart{width:100%;height:140px;margin-top:14px}
.search{margin-bottom:12px}
.empty{border:1px solid var(--line);border-radius:10px;padding:34px 22px;margin:14px 0;text-align:center}
.empty p{color:var(--mid);margin:8px 0 18px}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:pop .16s ease-out}
  @keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
}
</style>
</head>

/* ============================================================
   Atlas: routines, sessions, history
   ============================================================ */
const KEY="atlas.state.v3";
let S = load() || fresh();
if(!S.program) S.program={name:"My routines", days:[], sessions:[]};
if(!S.custom) S.custom=[];
CUSTOM=S.custom;
let UI = {tab:"home", wizard:null, toast:null, pickFor:null, draft:{}, histId:null, cal:null, calDay:null,
          search:"", newEx:null, exHist:null, editing:false, warmMark:{}, focus:null, ask:null,
          newRoutine:null, openSlots:{}, editRoutine:null, orm:null, tuneSlot:null, diag:null};
let tick=null;

function fresh(){ return {v:3, program:null, active:null, custom:[], cfg:{url:"",key:"",email:""}, updated:0}; }

function load(){
  try{
    let raw=localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
    const old=localStorage.getItem("mesocycle.state.v2") || localStorage.getItem("mesocycle.state.v1");
    return old ? migrate(JSON.parse(old)) : null;
  }catch(err){ return null; }
}

/* Old blocks become a plain set of routines. Every logged session is kept. */
function migrate(o){
  const s={v:3, program:null, active:null, custom:o.custom||[], cfg:o.cfg||{url:"",key:"",email:""}, updated:Date.now()};
  const m=o.meso;
  if(!m) return s;
  const sessions=(m.sessions||[]).slice();
  if(m.log){
    Object.keys(m.log).forEach(k=>{
      const [w,di,si]=k.split("-").map(Number);
      let sess=sessions.find(x=>x.week===w && x.di===di);
      if(!sess){ sess={id:"m"+w+"-"+di, di, week:w, start:null, end:null, entries:{}, finished:true}; sessions.push(sess); }
      sess.entries[si]=m.log[k];
    });
  }
  const wk=Math.min(m.week||1, (m.weeks||5)+1);
  const plan=(m.plan&&(m.plan[wk]||m.plan[1]))||[];
  s.program={
    name:m.name||"My routines",
    days:(m.days||[]).map((day,di)=>({
      name:day.name, hidden:!!day.hidden,
      slots:(day.slots||[]).map((sl,si)=>({
        muscle:sl.muscle, exId:sl.exId, ss:!!sl.ss, hidden:!!sl.hidden,
        sets:((plan[di]||[])[si]!=null ? plan[di][si] : (sl.sets||3))
      }))
    })),
    sessions
  };
  return s;
}

function syncCustom(){ CUSTOM = S.custom || (S.custom=[]); }
function save(push){
  S.updated=Date.now(); syncCustom();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(err){ toast("Storage full. Export a backup."); }
  if(push!==false) queueSync();
}

/* ============================================================
   PROGRAM
   ============================================================ */
function order(mk){ return MK.indexOf(mk); }

const P = () => S.program;
const visibleDays = () => P().days.filter(d=>!d.hidden);
function plannedSets(di,si){ const sl=P().days[di].slots[si]; return sl && !sl.hidden ? (sl.sets||0) : 0; }

/* Planned sets per muscle across every routine, one pass through the week */
function performedSets(mk, days){
  const cut=Date.now()-(days||7)*86400000;
  let n=0;
  P().sessions.filter(s=>s.finished && new Date(s.end||s.start)>=cut).forEach(s=>{
    const day=P().days[s.di]; if(!day) return;
    Object.keys(s.entries||{}).forEach(si=>{
      const slot=day.slots[si]; if(!slot || slot.muscle!==mk) return;
      n += (s.entries[si]||[]).filter(x=>!x.warm).length;
    });
  });
  return n;
}
function programSets(mk){
  let t=0;
  P().days.forEach((d,di)=>{ if(d.hidden) return; d.slots.forEach((s,si)=>{ if(s.muscle===mk) t+=plannedSets(di,si); }); });
  return t;
}
function sessionMuscles(di){
  const seen=[];
  P().days[di].slots.forEach((s,si)=>{ if(!s.hidden && plannedSets(di,si)>0 && !seen.includes(s.muscle)) seen.push(s.muscle); });
  return seen;
}
function lastEntry(di,si,exceptId){
  const ss=P().sessions.filter(x=>x.finished && x.di===di && x.entries && (x.entries[si]||[]).some(y=>!y.warm));
  for(let i=ss.length-1;i>=0;i--){ if(!exceptId || ss[i].id!==exceptId) return ss[i]; }
  return null;
}
function lastSessionFor(di){
  const ss=P().sessions.filter(x=>x.finished && x.di===di);
  return ss.length?ss[ss.length-1]:null;
}
function sessionVolume(sess){
  let v=0, sets=0;
  Object.values(sess.entries||{}).forEach(a=>a.forEach(s=>{ if(s.warm) return; v+=s.w*s.r; sets++; }));
  return {volume:Math.round(v), sets};
}
function exerciseHistory(exId){
  const out=[];
  P().sessions.filter(s=>s.finished).forEach(s=>{
    (P().days[s.di]?P().days[s.di].slots:[]).forEach((slot,si)=>{
      if(slot.exId!==exId) return;
      const sets=((s.entries||{})[si]||[]).filter(x=>!x.warm);
      if(sets.length) out.push({date:s.end||s.start, day:P().days[s.di].name, sets});
    });
  });
  return out.sort((a,b)=>new Date(a.date)-new Date(b.date));
}
const e1rm = s => s.w*(1+(s.r+(s.rir||0))/30);
function round(x,inc){ return Math.round(x/inc)*inc; }


/* Double progression against your own last effort on this slot */
const slotRange = (slot,ex) => (slot.rep && slot.rep.length===2) ? slot.rep : ex.rep;
const slotInc = (slot,ex) => slot.inc || INC[ex.equip] || 2.5;
function target(di,si){
  const slot=P().days[di].slots[si], ex=exById(slot.exId), inc=slotInc(slot,ex), rng=slotRange(slot,ex);
  const prevSess=lastEntry(di,si, S.active?S.active.id:null);
  if(!prevSess) return {weight:null, reps:rng[0], note:"First time on this one. Find a weight you can hold for "+rng[0]+" to "+rng[1]+" reps."};
  const arr=(prevSess.entries[si]||[]).filter(x=>!x.warm);
  if(!arr.length) return {weight:null, reps:rng[0], note:"Only warm-ups logged last time."};
  const best=arr[arr.length-1];
  if(best.r>=rng[1])
    return {weight:round(best.w+inc,inc), reps:rng[0], note:"You topped the rep range. Add weight, back to "+rng[0]+" reps."};
  const bump=(best.rir||0)>=3 ? 2 : 1;
  return {weight:round(best.w,inc), reps:Math.min(rng[1],best.r+bump), note:"Same weight, chase "+Math.min(rng[1],best.r+bump)+" reps."};
}

let sb=null, syncTimer=null;
async function initSync(){
  if(!S.cfg.url || !S.cfg.key) return null;
  if(sb) return sb;
  const mod=await import("https://esm.sh/@supabase/supabase-js@2");
  sb=mod.createClient(S.cfg.url, S.cfg.key);
  return sb;
}
function queueSync(){ if(!S.cfg.url||!S.cfg.key) return; clearTimeout(syncTimer); syncTimer=setTimeout(pushRemote,2500); }
async function pushRemote(){
  try{
    const c=await initSync(); if(!c) return;
    const {data:{user}}=await c.auth.getUser(); if(!user) return;
    await c.from("training_state").upsert({user_id:user.id, data:S, updated_at:new Date().toISOString()});
  }catch(err){ console.warn("sync push failed",err); }
}
async function pullRemote(silent){
  try{
    const c=await initSync(); if(!c){ if(!silent) toast("Add your Supabase details first."); return; }
    const {data:{user}}=await c.auth.getUser();
    if(!user){ if(!silent) toast("Sign in first."); return; }
    const {data}=await c.from("training_state").select("data").eq("user_id",user.id).maybeSingle();
    if(data&&data.data&&(data.data.updated||0)>(S.updated||0)){
      S = data.data.v===3 ? data.data : migrate(data.data);
      syncCustom(); save(false); render(); toast("Pulled from cloud.");
    } else if(!silent) toast("This device is already current.");
  }catch(err){ if(!silent){ UI.diag="Pull failed: "+(err&&err.message?err.message:String(err)); render(); } }
}
async function signIn(email){
  UI.diag="Sending...";
  render();
  try{
    if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(S.cfg.url)){
      UI.diag="The project URL looks wrong. It should be https://yourprojectid.supabase.co with nothing after it."; render(); return;
    }
    if(!S.cfg.key || S.cfg.key.length<20){ UI.diag="The key looks wrong or missing."; render(); return; }
    const c=await initSync();
    if(!c){ UI.diag="Could not load the Supabase library. Are you online?"; render(); return; }
    const {error}=await c.auth.signInWithOtp({email, options:{emailRedirectTo:location.href.split("#")[0]}});
    UI.diag = error ? ("Supabase said: "+(error.message||JSON.stringify(error))+(error.status?" (status "+error.status+")":""))
                    : "Sent. Check your email, including spam.";
  }catch(err){
    UI.diag="Failed before reaching Supabase: "+(err && err.message ? err.message : String(err));
  }
  render();
}

/* Plain reachability test that does not involve email at all */
async function testConnection(){
  UI.diag="Testing...";
  render();
  try{
    const r=await fetch(S.cfg.url+"/auth/v1/health", {headers:{apikey:S.cfg.key, Authorization:"Bearer "+S.cfg.key}});
    UI.diag = r.ok ? "Connection works. Status "+r.status+". The URL and key are reaching your project."
                   : "Reached Supabase but it refused the request. Status "+r.status+". Usually a wrong or disabled key.";
  }catch(err){
    UI.diag="Could not reach that URL at all: "+(err&&err.message?err.message:String(err))+". Check the project URL.";
  }
  render();
}
async function whoami(){
  try{ const c=await initSync(); if(!c) return null; const {data:{user}}=await c.auth.getUser(); return user?user.email:null; }catch(err){ return null; }
}

const $=s=>document.querySelector(s);
const h=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m){ UI.toast=m; render(); setTimeout(()=>{UI.toast=null;render();},2200); }
function ask(msg, act, arg, danger){ UI.ask={msg, act, arg, danger:!!danger}; render(); }
function askSheet(){
  if(!UI.ask) return "";
  return `<div class="scrim"><div class="sheet"><p>${h(UI.ask.msg)}</p>
    <button class="btn ${UI.ask.danger?"":"solid"}" data-askyes="1" ${UI.ask.danger?'style="border-color:var(--red);color:var(--red)"':""}>Yes, do it</button>
    <button class="btn" data-askno="1">Cancel</button></div></div>`;
}
function fmt(n){ return n==null||n===""?"":(Math.round(n*10)/10).toString().replace(/\.0$/,""); }
const RATING=["Awful","Poor","Fine","Good","Great"];
function face(i,on){
  const mouths=["M30 62 Q44 48 58 62","M30 60 Q44 52 58 60","M30 57 L58 57","M30 54 Q44 62 58 54","M30 50 Q44 66 58 50"];
  const c=on?"#120f0b":"#a8a29a";
  return `<svg viewBox="0 0 88 88" width="44" height="44" aria-hidden="true">
    <circle cx="44" cy="44" r="30" fill="none" stroke="${c}" stroke-width="3"/>
    <circle cx="34" cy="36" r="3.2" fill="${c}"/><circle cx="54" cy="36" r="3.2" fill="${c}"/>
    <path d="${mouths[i]}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"/></svg>`;
}
const DAYNAMES=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function dstamp(iso){ const d=new Date(iso); return DAYNAMES[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()]; }
function tstamp(iso){ const d=new Date(iso); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function dkey(iso){ const d=new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function ago(iso){ const days=Math.floor((Date.now()-new Date(iso))/86400000); return days<=0?"today":days===1?"yesterday":days+" days ago"; }
function dur(ms){ const s=Math.floor(ms/1000), m=Math.floor(s/60); return m<60?m+" min":Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m"; }
function clockText(){
  if(!S.active||!S.active.start) return "";
  const s=Math.floor((Date.now()-new Date(S.active.start))/1000);
  return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}
function startTick(){ stopTick(); tick=setInterval(()=>{ const el=$("#clock"); if(el) el.textContent=clockText(); },1000); }
function stopTick(){ if(tick) clearInterval(tick); tick=null; }
function focusBack(){
  if(!UI.focus) return;
  const el=document.getElementById(UI.focus);
  if(el){ el.focus(); try{ el.setSelectionRange(el.value.length, el.value.length); }catch(err){} }
}

function render(){
  const app=$("#app"), foot=$("#foot");
  if(UI.newRoutine){ stopTick(); app.innerHTML=viewNewRoutine(); foot.innerHTML=askSheet(); focusBack(); return; }
  if(UI.newEx){ stopTick(); app.innerHTML=viewNewEx(); foot.innerHTML=askSheet(); return; }
  if(UI.pickFor){ stopTick(); app.innerHTML=viewPicker(); foot.innerHTML=askSheet(); focusBack(); return; }
  if(UI.tuneSlot){ stopTick(); app.innerHTML=viewTune(); foot.innerHTML=askSheet(); return; }
  if(UI.editRoutine!=null){ stopTick(); app.innerHTML=viewRoutineEditor(); foot.innerHTML=askSheet(); return; }
  if(S.active && !S.active.finishing){ app.innerHTML=viewSession(); foot.innerHTML=footSession()+askSheet(); startTick(); }
  else if(S.active){ stopTick(); app.innerHTML=viewFinish(); foot.innerHTML=footFinish()+askSheet(); }
  else{
    stopTick();
    app.innerHTML = navBar() + (UI.exHist ? viewExHistory()
      : UI.tab==="home"?viewHome() : UI.tab==="history"?viewHistory() : UI.tab==="info"?viewInfo() : viewSettings());
    foot.innerHTML = askSheet();
    focusBack();
  }
  if(UI.toast) foot.insertAdjacentHTML("beforeend",`<div class="toast">${h(UI.toast)}</div>`);

/* ---------- Session ---------- */
function viewSession(){
  const a=S.active, di=a.di, day=P().days[di];
  let body="";
  day.slots.forEach((slot,si)=>{
    const sets=plannedSets(di,si);
    if(slot.hidden || sets<=0) return;
    const ex=exById(slot.exId), t=target(di,si);
    const log=a.entries[si]||[];
    if(log.length>=sets && !UI.openSlots[si]){
      const w=log.filter(x=>!x.warm);
      const summary=w.length?`${fmt(w[w.length-1].w)} kg &times; ${w.map(x=>x.r).join(", ")}`:"warm-ups only";
      body+=`<button class="done-line" data-openslot="${si}"><span class="nm">${h(ex.name)}</span><span class="vals">${summary}</span></button>`;
      return;
    }
    const prevSess=lastEntry(di,si,a.id), prev=prevSess?(prevSess.entries[si]||[]).filter(x=>!x.warm):null;
    let rows="";
    for(let i=0;i<Math.max(sets,log.length);i++){
      const s=log[i], done=!!s, p=prev&&prev[i];
      const carry=(!done && i>0 && log[i-1])?log[i-1]:null;
      const phW=carry?fmt(carry.w):(t.weight!=null?fmt(t.weight):"kg");
      const phR=carry?carry.r:t.reps;
      const warm=(s&&s.warm)||UI.warmMark[si+"-"+i];
      rows+=`${p?`<div class="setgrid"><span></span><div class="prev">last time ${fmt(p.w)} kg &times; ${p.r}${p.rir!=null?" @ "+p.rir+" RIR":""}</div><span></span></div>`:""}
      <div class="setrow ${done?"done":""}">
        <button class="idx ${warm?"warm":""}" data-warm="${si}-${i}" aria-label="Mark set ${i+1} as a warm-up">${warm?"W":i+1}</button>
        <input inputmode="decimal" data-in="w" data-si="${si}" data-i="${i}" value="${done?fmt(s.w):h(UI.draft[si+"-"+i+"-w"]||"")}" placeholder="${phW}" aria-label="Weight set ${i+1}">
        <input inputmode="numeric" data-in="r" data-si="${si}" data-i="${i}" value="${done?s.r:h(UI.draft[si+"-"+i+"-r"]||"")}" placeholder="${phR}" aria-label="Reps set ${i+1}">
        <input inputmode="numeric" data-in="rir" data-si="${si}" data-i="${i}" value="${done?(s.rir==null?"":s.rir):h(UI.draft[si+"-"+i+"-rir"]||"")}" placeholder="RIR" aria-label="Reps in reserve set ${i+1}">
        <button class="tick" data-logset="${si}" data-i="${i}">${done?"&check;":"Log"}</button>
      </div>${done && !s.warm && p && (s.w*s.r > p.w*p.r)?`<div class="metaline" style="margin:-2px 0 6px">Better than last time<span class="pb">PB</span></div>`:""}`;
    }
    body+=`<div class="card">
      ${slot.ss?`<div class="sslabel">Superset with ${h(exById(day.slots[si-1].exId).name)}</div>`:""}
      <div class="row sb"><button style="text-align:left" data-exhist="${h(slot.exId)}"><h2>${h(ex.name)}</h2></button>
        <button class="pill" data-swap="${di}-${si}">Swap</button></div>
      <div class="row" style="align-items:baseline;gap:12px;margin-top:10px">
        <span class="big">${t.weight!=null?fmt(t.weight):"&mdash;"}</span><span class="muted">kg &times; ${t.reps} reps</span></div>
      ${slot.note?`<div class="metaline" style="color:var(--mid)">${h(slot.note)}</div>`:""}
      <div class="metaline">${h(t.note)} Target ${sets} sets.</div>
      <div class="setgrid" style="margin-top:14px"><span></span>
        <span class="dim" style="text-align:center">kg</span><span class="dim" style="text-align:center">reps</span>
        <span class="dim" style="text-align:center">RIR</span><span></span></div>
      ${rows}
      <button class="btn small" data-addset="${si}" style="margin-top:10px">Add a set</button>
    </div>`;
  });
  const v=sessionVolume(a);
  return `<div class="nav"><div class="brand">Atlas</div></div>
    <div class="top"><div class="clockbar"><h1>${h(day.name)}</h1><span class="clock" id="clock">${clockText()}</span></div>
      <span class="sub">${dstamp(a.start)}<br>${tstamp(a.start)}</span></div>
    <div class="wrap">${body}
    <button class="btn" data-addex="${di}">Add an exercise to this session</button>
    <div class="card flat dim">${v.sets} sets logged, ${v.volume.toLocaleString()} kg lifted</div></div>`;
}

function viewCalendar(sessions){
  const now=new Date();
  const c=UI.cal||(UI.cal={y:now.getFullYear(), m:now.getMonth()});
  const lead=(new Date(c.y,c.m,1).getDay()+6)%7;
  const days=new Date(c.y,c.m+1,0).getDate();
  const byDay={};
  sessions.forEach(s=>{ const k=dkey(s.end||s.start); (byDay[k]=byDay[k]||[]).push(s); });
  const todayKey=dkey(new Date().toISOString());
  let cells="";
  for(let i=0;i<lead;i++) cells+=`<span class="day empty"></span>`;
  for(let n=1;n<=days;n++){
    const k=c.y+"-"+String(c.m+1).padStart(2,"0")+"-"+String(n).padStart(2,"0");
    const has=!!byDay[k];
    cells+=`<button class="day ${has?"has":""} ${k===todayKey?"today":""}" data-pickday="${k}" aria-pressed="${UI.calDay===k}" ${has?"":"disabled"}>${n}${has?"<i></i>":""}</button>`;
  }
  return `<div class="calwrap">
    <div class="calhead"><button data-cal="-1" aria-label="Previous month">&lsaquo;</button>
      <strong>${MONTHS[c.m]} ${c.y}</strong>
      <button data-cal="1" aria-label="Next month">&rsaquo;</button></div>
    <div class="cal">${["M","T","W","T","F","S","S"].map(x=>`<span class="wd">${x}</span>`).join("")}${cells}</div></div>`;
}
/* Gap between each logged set and the one before it, across the whole session */
function restMap(s){
  const all=[];
  Object.keys(s.entries||{}).forEach(si=>(s.entries[si]||[]).forEach((x,i)=>{ if(x.t) all.push({si, i, t:new Date(x.t).getTime()}); }));
  all.sort((a,b)=>a.t-b.t);
  const out={};
  all.forEach((x,n)=>{ if(n>0){ const g=Math.round((x.t-all[n-1].t)/1000); if(g>=20 && g<=1800) out[x.si+"-"+x.i]=g; } });
  return out;
}
const gap = s => Math.floor(s/60)+":"+String(s%60).padStart(2,"0");

function viewExHistory(){
  const ex=exById(UI.exHist), hist=exerciseHistory(UI.exHist);
  const pts=hist.map(x=>{ const best=x.sets.reduce((a,b)=>e1rm(b)>e1rm(a)?b:a); return {d:x.date, v:e1rm(best)}; });
  let chart="";
  if(pts.length>1){
    const vals=pts.map(p=>p.v), lo=Math.min(...vals)*0.97, hi=Math.max(...vals)*1.03, W=320, H=120;
    const xy=i=>[8+i*(W-16)/(pts.length-1), H-10-((pts[i].v-lo)/(hi-lo))*(H-26)];
    const path=pts.map((p,i)=>{ const [x,y]=xy(i); return (i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1); }).join(" ");
    const dots=pts.map((p,i)=>{ const [x,y]=xy(i); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="#b08d57"/>`; }).join("");
    chart=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Estimated one rep max over time">
      <path d="${path}" fill="none" stroke="#b08d57" stroke-width="2"/>${dots}</svg>
      <p class="metaline">Estimated one rep max, ${fmt(pts[0].v)} kg to ${fmt(pts[pts.length-1].v)} kg.</p>`;
  }
  return `<div class="top"><h1>${h(ex.name)}</h1><span class="sub">${h(M[ex.muscle].name)}</span></div>
  <div class="wrap">
    ${hist.length?`<div class="card"><h2>Progress</h2>${chart||`<p class="dim">One session so far. The chart appears from the second.</p>`}</div>`:""}
    ${hist.slice().reverse().map(x=>`<div class="card">
      <div class="row sb"><h2>${dstamp(x.date)}</h2><span class="dim">${h(x.day)}</span></div>
      <table><tbody>${x.sets.map((s,i)=>`<tr><td class="dim">Set ${i+1}</td>
        <td class="n">${fmt(s.w)} kg &times; ${s.r}${s.rir!=null&&s.rir!==""?" @ "+s.rir+" RIR":""}</td></tr>`).join("")}</tbody></table>
    </div>`).join("") || `<div class="empty"><h2>No sets yet</h2><p>Log this exercise once and its history builds here.</p></div>`}
    <button class="btn" data-closeex="1">Back</button></div>`;
}

function doAct(act, arg){
  const p=P();
  if(act==="discard"){ S.active=null; UI.draft={}; UI.warmMark={}; UI.openSlots={}; save(); toast("Session discarded."); return; }
  if(act==="removeex"){ const [di,si]=arg.split("-").map(Number); p.days[di].slots[si].hidden=true; save(); return; }
  if(act==="delroutine"){
    const di=+arg;
    if(visibleDays().length<=1){ toast("Keep at least one routine."); return; }
    p.days[di].hidden=true; UI.editRoutine=null; save(); toast("Routine deleted."); return;
  }
  if(act==="delsession"){ p.sessions=p.sessions.filter(x=>x.id!==arg); UI.histId=null; UI.editing=false; save(); toast("Session deleted."); return; }
  if(act==="newprogram"){ S.program={name:"My routines", days:[], sessions:P().sessions}; S.active=null; save(); return; }
  if(act==="reset"){
    ["atlas.state.v3","mesocycle.state.v2","mesocycle.state.v1"].forEach(k=>localStorage.removeItem(k));
    S=fresh(); syncCustom();
    UI={tab:"home",wizard:null,toast:null,pickFor:null,draft:{},histId:null,cal:null,calDay:null,search:"",newEx:null,
        exHist:null,editing:false,warmMark:{},focus:null,ask:null,newRoutine:null,openSlots:{},editRoutine:null,orm:null};
    return;
  }
}

document.addEventListener("click", async ev=>{
  const b=ev.target.closest("button"); if(!b) return;
  const d=b.dataset;

  if(d.askyes){ const a=UI.ask; UI.ask=null; if(a) doAct(a.act,a.arg); render(); return; }
  if(d.askno){ UI.ask=null; render(); return; }

  if(d.tab){ UI.tab=d.tab; UI.pickFor=null; UI.histId=null; UI.exHist=null; UI.editing=false; UI.editRoutine=null; UI.tuneSlot=null; UI.focus=null; window.scrollTo(0,0); render(); return; }
  if(d.openslot!=null && d.openslot!==""){ UI.openSlots[d.openslot]=!UI.openSlots[d.openslot]; render(); return; }
  if(d.exhist){ UI.exHist=d.exhist; UI.focus=null; window.scrollTo(0,0); render(); return; }
  if(d.closeex){ UI.exHist=null; window.scrollTo(0,0); render(); return; }


  /* routines */
  if(d.newroutine){ UI.newRoutine={di:null,name:""}; UI.focus="rtname"; render(); return; }
  if(d.renameroutine){ UI.newRoutine={di:+d.renameroutine, name:P().days[+d.renameroutine].name}; UI.focus="rtname"; render(); return; }
  if(d.cancelroutine){ UI.newRoutine=null; UI.focus=null; render(); return; }
  if(d.saveroutine){
    const name=$("#rtname").value.trim();
    if(!name){ toast("Give it a name."); return; }
    if(UI.newRoutine.di!=null) P().days[UI.newRoutine.di].name=name;
    else { P().days.push({name, slots:[], hidden:false}); UI.editRoutine=P().days.length-1; }
    UI.newRoutine=null; UI.focus=null; save(); render(); return;
  }
  if(d.tune){ UI.tuneSlot=d.tune; window.scrollTo(0,0); render(); return; }
  if(d.canceltune){ UI.tuneSlot=null; render(); return; }
  if(d.savetune){
    const [di,si]=UI.tuneSlot.split("-").map(Number), slot=P().days[di].slots[si];
    const lo=parseInt($("#tlo").value,10), hi=parseInt($("#thi").value,10), inc=parseFloat($("#tinc").value);
    slot.note=$("#tnote").value.trim();
    if(!isNaN(lo)&&!isNaN(hi)&&lo>0&&hi>=lo) slot.rep=[lo,hi];
    if(!isNaN(inc)&&inc>0) slot.inc=inc;
    UI.tuneSlot=null; save(); render(); toast("Saved."); return;
  }
  if(d.duproutine){
    const di=+d.duproutine, src=P().days[di];
    P().days.push({name:src.name+" copy", hidden:false,
      slots:src.slots.filter(s=>!s.hidden).map(s=>Object.assign({}, s))});
    UI.editRoutine=P().days.length-1;
    save(); window.scrollTo(0,0); render(); toast("Routine duplicated."); return;
  }
  if(d.editroutine){ UI.editRoutine=+d.editroutine; window.scrollTo(0,0); render(); return; }
  if(d.closeeditor){ UI.editRoutine=null; window.scrollTo(0,0); render(); return; }
  if(d.delroutine){ ask("Delete "+P().days[+d.delroutine].name+"? Past sessions are kept.", "delroutine", d.delroutine, true); return; }
  if(d.sets){
    const [di,si]=d.sets.split("-").map(Number), sl=P().days[di].slots[si];
    sl.sets=Math.max(0, Math.min(10, sl.sets+(+d.delta)));
    save(); render(); return;
  }
  if(d.remove){
    const [di,si]=d.remove.split("-").map(Number);
    ask("Remove "+exById(P().days[di].slots[si].exId).name+" from "+P().days[di].name+"? Past sessions are kept.", "removeex", d.remove, true);
    return;
  }
  if(d.ss){ const [di,si]=d.ss.split("-").map(Number); const sl=P().days[di].slots[si]; sl.ss=!sl.ss; save(); render(); return; }
  if(d.addex){ UI.pickFor="add-"+d.addex; window.scrollTo(0,0); render(); return; }
  if(d.swap){ UI.pickFor=d.swap; window.scrollTo(0,0); render(); return; }
  if(d.pick){
    if(UI.pickFor.startsWith("add-")){
      const di=+UI.pickFor.slice(4), ex=exById(d.pick);
      P().days[di].slots.push({muscle:ex.muscle, exId:ex.id, sets:3, ss:false, hidden:false});
    } else {
      const [di,si]=UI.pickFor.split("-").map(Number);
      P().days[di].slots[si].exId=d.pick;
    }
    UI.pickFor=null; UI.search=""; UI.focus=null; save(); render(); return;
  }
  if(d.cancelpick){ UI.pickFor=null; UI.search=""; UI.focus=null; render(); return; }
  if(d.newex){ UI.newEx={muscle:"chest", equip:"machine", lo:8, hi:12, name:""}; render(); return; }
  if(d.cancelnewex){ UI.newEx=null; render(); return; }
  if(d.savenewex){
    const name=$("#nxname").value.trim();
    if(!name){ toast("Give it a name."); return; }
    const lo=parseInt($("#nxlo").value,10)||8, hi=parseInt($("#nxhi").value,10)||12;
    S.custom.push({id:"c"+Date.now(), name, muscle:$("#nxmuscle").value, equip:$("#nxequip").value, rep:[Math.min(lo,hi),Math.max(lo,hi)], fav:true});
    syncCustom(); UI.newEx=null; UI.search=name; save(); render(); toast("Exercise saved."); return;
  }

  /* session */
  if(d.start!=null && d.start!==""){
    const di=+d.start;
    S.active={id:"s"+Date.now(), di, start:new Date().toISOString(), entries:{}, rating:null, finished:false, finishing:false};
    UI.draft={}; UI.warmMark={}; UI.openSlots={}; save(); window.scrollTo(0,0); render(); return;
  }
  if(d.logset!=null && d.logset!==""){
    const si=+d.logset, i=+d.i, a=S.active;
    const row=b.closest(".setrow"), g=n=>row.querySelector('[data-in="'+n+'"]');
    const lg=a.entries[si]||(a.entries[si]=[]);
    if(lg[i]){ lg.splice(i,1); save(); render(); return; }
    const w=parseFloat(g("w").value||g("w").placeholder);
    const r=parseInt(g("r").value||g("r").placeholder,10);
    const rirRaw=g("rir").value;
    if(isNaN(w)||isNaN(r)){ toast("Enter a weight and reps."); return; }
    lg[i]={w, r, rir:rirRaw===""?null:parseInt(rirRaw,10), t:new Date().toISOString()};
    if(UI.warmMark[si+"-"+i]){ lg[i].warm=true; delete UI.warmMark[si+"-"+i]; }
    ["w","r","rir"].forEach(f=>delete UI.draft[si+"-"+i+"-"+f]);
    save(); render(); return;
  }
  if(d.addset!=null && d.addset!==""){ P().days[S.active.di].slots[+d.addset].sets++; save(); render(); return; }
  if(d.warm){
    const [si,i]=d.warm.split("-").map(Number), lg=S.active.entries[si]||[];
    if(lg[i]) lg[i].warm=!lg[i].warm;
    else UI.warmMark[si+"-"+i]=!UI.warmMark[si+"-"+i];
    save(); render(); return;
  }
  if(d.finishsession){ S.active.finishing=true; window.scrollTo(0,0); save(); render(); return; }
  if(d.backtosession){ S.active.finishing=false; window.scrollTo(0,0); render(); return; }
  if(d.discard){ ask("Discard this session? Nothing is saved.", "discard", null, true); return; }
  if(d.rate!=null && d.rate!==""){ if(S.active){ S.active.rating=+d.rate; save(); render(); } return; }
  if(d.savesession){
    const a=S.active;
    if(!Object.values(a.entries).some(x=>x.length)){ toast("Nothing logged. Discard instead."); return; }
    const nf=$("#snote"); if(nf) a.note=nf.value.trim();
    a.end=new Date().toISOString(); a.finished=true; delete a.finishing;
    P().sessions.push(a); S.active=null; UI.draft={}; UI.warmMark={}; UI.openSlots={}; UI.tab="home";
    save(); window.scrollTo(0,0); render(); toast("Session saved."); return;
  }

  /* history */
  if(d.hist){ UI.histId=d.hist; window.scrollTo(0,0); render(); return; }
  if(d.closehist){ UI.histId=null; UI.editing=false; render(); return; }
  if(d.cal){ const c=UI.cal, n=c.m+(+d.cal); UI.cal={y:c.y+Math.floor(n/12), m:((n%12)+12)%12}; render(); return; }
  if(d.pickday){ UI.calDay=(UI.calDay===d.pickday)?null:d.pickday; render(); return; }
  if(d.clearday){ UI.calDay=null; render(); return; }
  if(d.eedit){ UI.editing=true; window.scrollTo(0,0); render(); return; }
  if(d.ecancel){ UI.editing=false; render(); return; }
  if(d.erate){ const s=P().sessions.find(x=>x.id===UI.histId); if(s){ s.rating=+d.erate; save(); render(); } return; }
  if(d.ewarm){
    const [si,i]=d.ewarm.split("-").map(Number), s=P().sessions.find(x=>x.id===UI.histId);
    if(s&&s.entries[si]&&s.entries[si][i]){ s.entries[si][i].warm=!s.entries[si][i].warm; save(); render(); }
    return;
  }
  if(d.edrop){
    const [si,i]=d.edrop.split("-").map(Number), s=P().sessions.find(x=>x.id===UI.histId);
    if(s&&s.entries[si]){ s.entries[si].splice(i,1); save(); render(); }
    return;
  }
  if(d.esave){
    const s=P().sessions.find(x=>x.id===UI.histId); if(!s) return;
    const nf=document.querySelector("[data-snote]"); if(nf) s.note=nf.value.trim();
    document.querySelectorAll("[data-e]").forEach(el=>{
      const si=el.dataset.si, i=+el.dataset.i, f=el.dataset.e;
      if(!s.entries[si]||!s.entries[si][i]) return;
      if(f==="rir"){ s.entries[si][i].rir = el.value===""?null:parseInt(el.value,10); return; }
      const v=f==="w"?parseFloat(el.value):parseInt(el.value,10);
      if(!isNaN(v)) s.entries[si][i][f]=v;
    });
    UI.editing=false; save(); render(); toast("Session updated."); return;
  }
  if(d.edelete){ ask("Delete this session? It cannot be recovered.", "delsession", UI.histId, true); return; }

  /* info */
  if(d.orm){
    const w=parseFloat($("#ormw").value), r=parseInt($("#ormr").value,10);
    if(isNaN(w)||isNaN(r)||r<1){ toast("Enter a weight and reps."); return; }
    UI.orm={w, r:Math.min(20,r)}; render(); return;
  }

  /* settings */
  if(d.savecfg){ S.cfg.url=$("#sburl").value.trim().replace(/\/$/,""); S.cfg.key=$("#sbkey").value.trim(); sb=null; save(false); toast("Saved."); render(); return; }
  if(d.signin){
    const em=$("#sbemail").value.trim();
    if(!em || em.indexOf("@")<0){ toast("Enter your email first."); return; }
    S.cfg.email=em; save(false); signIn(em); return;
  }
  if(d.testconn){
    S.cfg.url=$("#sburl").value.trim().replace(/\/$/,""); S.cfg.key=$("#sbkey").value.trim(); sb=null; save(false);
    testConnection(); return;
  }
  if(d.pull){ pullRemote(false); return; }
  if(d.push){ await pushRemote(); toast("Pushed."); return; }
  if(d.export){
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));
    a.download="atlas-backup-"+new Date().toISOString().slice(0,10)+".json"; a.click(); URL.revokeObjectURL(a.href); return;
  }
  if(d.import){ $("#importfile").click(); return; }
  if(d.csv){
    const rows=[["date","time","routine","exercise","set","warm_up","kg","reps","rir","session_rating"]];
    P().sessions.filter(x=>x.finished).forEach(s=>{
      const day=P().days[s.di]; if(!day) return;
      Object.keys(s.entries||{}).forEach(si=>{
        const slot=day.slots[si]; if(!slot) return;
        (s.entries[si]||[]).forEach((x,i)=>rows.push([dkey(s.end||s.start), tstamp(s.start||s.end), day.name,
          exById(slot.exId).name, i+1, x.warm?"yes":"no", x.w, x.r, x.rir==null?"":x.rir, s.rating!=null?RATING[s.rating]:""]));
      });
    });
    const csv=rows.map(r=>r.map(c=>/[",]/.test(String(c))?'"'+String(c).replace(/"/g,'""')+'"':c).join(",")).join("\n");
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    a.download="atlas-sessions-"+new Date().toISOString().slice(0,10)+".csv"; a.click(); URL.revokeObjectURL(a.href); return;
  }
  if(d.newprogram){ ask("Clear every routine? Past sessions are kept.", "newprogram", null, true); return; }
  if(d.reset){ ask("Erase everything on this device? Cloud data is untouched until the next push.", "reset", null, true); return; }
});

document.addEventListener("change", ev=>{
  if(ev.target.id==="importfile"){
    const f=ev.target.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const o=JSON.parse(fr.result);
        S = o.v===3 ? o : migrate(o);
        syncCustom(); save(); render(); toast("Imported.");
      }catch(err){ toast("That file did not parse."); }
    };
    fr.readAsText(f);
  }
});
document.addEventListener("input", ev=>{
  const t=ev.target;
  if(t.id==="exsearch"){ UI.search=t.value; UI.focus="exsearch"; render(); return; }
  if(t.dataset && t.dataset.in) UI.draft[t.dataset.si+"-"+t.dataset.i+"-"+t.dataset.in]=t.value;
});

/* ============================================================
   BOOT
   ============================================================ */
render();
if(S.cfg.url && S.cfg.key){
  pullRemote(true).then(()=>whoami()).then(em=>{
    const el=document.getElementById("who");
    if(el) el.textContent = em?"Signed in as "+em:"Not signed in on this device.";
  });
}
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
</body>
</html>
